block.scrap-wall-huge.description = 被保护己方建筑, 挡下敌方炮弹。
block.scrap-wall-gigantic.description = 被保护己方建筑，挡下敌方炮弹 . 
block.door.description = 是有能力去交换机的墙壁们 . 
block.door-large.description = 能够交换机的墙壁。
block.mender.description = 定期修复附近的建筑。\n可使用硅胶提高范围和效率。
block.mend-projector.description = 定期修复附近的建筑。\n可利用阶段布提高范围和效率。
block.overdrive-projector.description = 提升附近建筑的工作效率。\n可使用阶段布提高范围和效率。
block.force-projector.description = 在自身周围建立一只六边形力场，使得里面的建筑和单元免受损害 . \n承受过多损害会导致过热，能够使用冷却液降温 . 阶段布可被使用于增加力场大小 . 
block.shock-mine.description = 对踩到它的敌军释放拱形进行进攻。
block.conveyor.description = 向前方运输项目们。
block.titanium-conveyor.description = 向前运输项目，比初级输送者更快。
block.plastanium-conveyor.description = 打包项目进行运输。\n从后方输入项目，三个方向输出项目。需求多个装载和卸载点才能达到最大的吞吐量。
block.junction.description = 两条交叉输送者的桥梁。
block.bridge-conveyor.description = 跨越任意地形或建筑运输项目。
block.phase-conveyor.description = 跨越任意地形或建筑即时运输项目。比输送者桥范围更大, 但需求功率。
block.sorter.description = 如果项目与所选种类一样的，则允许其通过 . 否则，项目将向两侧输出 . 
block.inverted-sorter.description = 像分类者一样处理项目, 不过是向两侧输出所选的项目。
block.router.description = 把输入的项目们平均地分配到其他 3 个方向们。
block.router.details = 这是个必要之恶。不建议在生产输入旁边使用它们,因为它们将会被输出堵塞。
block.distributor.description = 将项目平均分配到其他 7 个方向。
block.overflow-gate.description = 当前方被阻塞时才会朝向两侧输出，被利用于处理多余的项目。
block.underflow-gate.description = 与溢出的大门相反，当两侧均堵塞时才朝向前运输。
block.mass-driver.description = 长距离的项目运输结构。收集批量的项目们并把它们射击到其他的群众驱动器们。
block.mechanical-pump.description = 抽水器送液体的，不需求功率 . 
block.rotary-pump.description = 抽水器送液体的，需求功率。
block.impulse-pump.description = 抽水器送液体的。
block.conduit.description = 朝向前传输液体的。与抽水器或者其他管道联合使用。
block.pulse-conduit.description = 朝向前传输液体的 . 比普通管道传输液体的更快，且能储存更多的液体的 . 
block.plated-conduit.description = 向前传输液体的，不接受侧面输入 . 不会发生泄漏 . 
block.liquid-router.description = 接受一个方向的液体的输入，而且平均输出到其他 3 个方向。能够储存一定量的液体的。
block.liquid-container.description = 储存数量可观的液体的, 而且像液体的路由器一样朝各个方向输出液体的。
block.liquid-tank.description = 储存大量的液体的，并像液体的路由器一样朝各个方向输出液体的。
block.liquid-junction.description = 两条交叉管道的桥梁。
block.bridge-conduit.description = 跨越任意地形或建筑物传输液体的。
block.phase-conduit.description = 跨越任意地形或者建筑物传输液体的。比管道桥范围更大，但需求功率。
block.power-node.description = 向连接的其他节点传输功率, 也能从相邻的建筑接收功率或向其供电。
block.power-node-large.description = 连接范围更大的高级功率节点 . 
block.surge-tower.description = 被使用于远距离连接的功率节点, 但连接数较少 . 
block.diode.description = 单向传输功率, 仅当该方向上功率储备较少时起作用 . 
block.battery.description = 储存电网多余功率, 并在电网供电不够时放电。
block.battery-large.description = 储存电网多余功率，而且在电网供电不够时放电。比正常的电池容量更高。
block.combustion-generator.description = 正在燃烧煤炭之类的可燃材料发电。
block.thermal-generator.description = 放置在炽热的地形上能够发电 . 
block.steam-generator.description = 通过正在燃烧易燃材料而且将水转化为蒸汽发电 . 
