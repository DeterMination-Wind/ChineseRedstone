hint.derelict = [accent]废墟[]建筑物是旧的基地的破碎的残余物,它们不再起作用。\n\n这些建筑物可以被[accent]破坏[]以获得资源们。
hint.research = 使用 :tree: [accent]研究[]按钮去研究新的技术。
hint.research.mobile = 咔哒 :menu: [accent]菜单[]中的 :tree: [accent]技术们树[]按钮以研究新技术 . 
hint.unitControl = 按住[accent][[L-ctrl][]键而且[accent]咔哒[]己方单元或炮塔进行控制。
hint.unitControl.mobile = [accent][两次咔哒][]己方单元们或炮塔进行控制。
hint.unitSelectControl = 按[accent]L-shift[]键进入[accent]指挥方式[]以控制单元。\n在指挥方式下, 咔哒而且拖动框选单元。[accent]正确的按钮[]命令单元移动或进攻。
hint.unitSelectControl.mobile = 按左下角的[accent]指挥[]按钮进入[accent]指挥方式[]以控制单元 . \n在指挥方式下，长的按压并拖动框选单元 . [accent]咔哒[]命令单元移动或者进攻 . 
hint.launch = 一旦收集了充足的资源, 你就能够通过右下角的 :map: [accent]卡片[]选择附近的扇区[accent]发射[]核心。
hint.launch.mobile = 一旦收集到充足的资源, 你就是有能力去通过 :menu: [accent]菜单[]中的 :map: [accent]卡片[]选择附近的扇区[accent]发射[]核心。
hint.schematicSelect = 按住[accent][[F][]键用耗子框选建筑以复印贴。\n\n[accent][耗子中间的按钮][]复印单个建筑。
hint.rebuildSelect = 按住[accent][[B][]用耗子框选被摧毁的建筑以自动重建。
hint.rebuildSelect.mobile = 选择 :copy: 复印按钮, 然后咔哒 :wrench: 重建按钮并拖动以选中被摧毁的建筑。\n这将自动重建这些建筑。
hint.conveyorPathfind = 按住[accent][[L-Ctrl][]键并拖动输送者，使其自动寻路。
hint.conveyorPathfind.mobile = 使能够 :diagonal: [accent]输送者自动寻路[]后，拖动输送者可使其自动寻路。
hint.boost = 按住[accent][[L-Shift][]控制当前单元助推，可飞越障碍物 . \n\n只有一部分地面单元有助推功能 . 
hint.payloadPickup = 按[accent][[[]键拾取小的建筑或者单元作为有效载荷。
hint.payloadPickup.mobile = [accent]长的按压[]拾取一个小的建筑或单元作为有效载荷。
hint.payloadDrop = 按[accent]][]键放下载荷 . 
hint.payloadDrop.mobile = [accent]长的按压[]一个空的的位置将有效载荷放在那里。
hint.waveFire = [accent]挥手[]塔以水作为弹药时,会自动扑灭附近的火。
hint.guardian = [accent]守卫者[]单元们是装甲的。弱的弹药,比如[accent]警察[]和[accent]领导[],是[scarlet]不有效的[]。\n\n请使用更高的等级的塔们,或者使用 :graphite: [accent]铅笔芯[]作为 :duo: 二重奏炮和 :salvo: 齐射炮的弹药去把守卫者们拿下来。
hint.coreUpgrade = 核心们可以通过[accent]在上面放置更高的等级的核心们[]被提高。\n\n在 :core-shard: [accent]核心：碎片[]上放置一个 :core-foundation: [accent]核心：基础[]。请确信它的周围没有障碍物们。
hint.serpuloCoreZone = 能够在 :core-zone: [accent]核心区[]上建立更多的核心。
hint.cannotUpgrade = 如果您看到运输单元上方有一个 [red]:tree:[] 图标，说明它的提高版本尚未在技术树中开锁。\n\n必须先在 [accent]:tree: 技术树[] 中完成对应单元的提高研究，才能在重构工厂中制造它。
hint.presetLaunch = 灰色的[accent]着陆扇区[]，如[accent]冰冻森林[]，从其他任何的地方发射都能够到达，不需求先占领邻近的扇区 . \n\n[accent]号码编号的扇区[]，比如这个的，能够[accent]选择性[]占领 . 
hint.presetDifficulty = 这个扇区有一个[scarlet]高的敌军威胁等级[]。\n在没有适当的技术和准备的情况下,向这样的扇区发射是[accent]不被推荐的[]。
hint.coreIncinerate = 在核心被项目填满到容量之后,它收到的任何额外的这种类型的项目们将会被[accent]焚烧[]。
hint.factoryControl = 如果要设定某单元工厂的[accent]集合点[]，在指挥方式下咔哒该单元工厂，然后正确的按钮咔哒某位置，由它制造的单元将会自动移动到那里。
hint.factoryControl.mobile = 如果要设定某单元工厂的[accent]集合点[], 在指挥方式下咔哒该单元工厂, 然后再咔哒某位置, 由它制造的单元将会自动移动到那里。
gz.mine = 接近 :ore-copper: [accent]警察矿[]而且咔哒以手动开采 . 
gz.mine.mobile = 接近 :ore-copper: [accent]警察矿[]而且咔哒以手动开采。
gz.research = 打开 :tree: 技术们树。\n研究 :mechanical-drill: [accent]机械的演习[], 然后在右下角的菜单中将其选中。\n咔哒警察矿放置演习。
gz.research.mobile = 打开 :tree: 技术树。\n研究 :mechanical-drill: [accent]机械演习[]，然后在右下角的菜单中将其选中。\n咔哒警察矿放置演习。\n\n咔哒右下角的 \ue800 [accent]勾[]以确认。
gz.conveyors = 研究而且放置 :conveyor: [accent]输送者[]\n将演习挖掘的矿物移至核心。\n\n咔哒而且拖动以连续放置输送者。\n滚动[accent]耗子的轮子[]以转向。
gz.conveyors.mobile = 研究而且放置 :conveyor: [accent]输送者[]\n将演习挖掘的矿物移至核心 . \n\n长的按压一秒钟，然后拖动以连续放置输送者 . 
gz.drills = 扩大挖掘规模。\n放置更多的的机械演习。\n挖掘 100 警察。
gz.lead = :lead: [accent]领导[]是另一种常用资源。\n用演习挖掘领导矿。
gz.moveup = :up: 扩张以推进任务 . 
gz.turrets = 研究并放置 2 个 :duo: [accent]二重奏[]保卫核心。\n二重奏需求输送者供给 \uf838 [accent]弹药[]。
gz.duoammo = 用输送者给二重奏供给[accent]警察[]。
gz.walls = [accent]墙壁[]能够防止建筑受到损害。\n在炮塔周围放置一些 :copper-wall: [accent]警察墙壁[]。
gz.defend = 敌军来袭, 准备国防 . 
gz.aa = 正常的炮塔难以快速击落空的中单元 . \n :scatter: [accent]分散[]防空的能力出色, 但利用[accent]领导[]弹药 . 
gz.scatterammo = 用输送者给分散供给[accent]领导[]。
gz.supplyturret = [accent]给炮塔供弹
gz.zone1 = 这是出生点的敌军 . 
gz.zone2 = 波浪开始时, 范围内的所有的建筑都会被摧毁。
gz.zone3 = 波浪即将开始。\n做好准备。
gz.finish = 建立更多的炮塔，挖掘更多的资源，\n击退所有波浪以[accent]占领扇区[]。
ff.coal = 利用 :mechanical-drill: [accent]机械的演习[]来开采:ore-coal: [accent]煤炭[], 的说
ff.graphitepress = :tree: 研究而且放置 :graphite-press: [accent]铅笔芯印刷机[]。
ff.craft = 将 :coal: 煤炭放入 :graphite-press: [accent]铅笔芯印刷机[]。\n它将会向邻近输送者输出 :graphite: 铅笔芯。\n将 :graphite: 铅笔芯从 :graphite-press: [accent]铅笔芯印刷机[]中移至核心。
ff.generator = :coal: 煤炭也能够充当 :combustion-generator: [accent]火力生成器[]的燃料 . \n研究并放置一个 :combustion-generator: [accent]火力生成器[] . 
ff.coalpower = 将 :coal: 煤炭放入生成器中产出[accent]:power: 功率[]。
ff.coalpower.objective = :combustion-generator: 产出功率
ff.node = :power-node: [accent]功率节点[]是有能力去将功率传输到附近的方块 . \n研究并在生成器旁放置一个 :power-node: [accent]功率节点[] . 
ff.battery = :battery: [accent]电池[]能够存储功率 . \n研究并在功率节点旁放置一个 :battery: [accent]电池[] . 
ff.arc = :arc: [accent]拱形[]需求功率才能工作。研究而且在功率节点旁放置一只 :arc: [accent]拱形[]。
fungalpass.tutorial1 = 使用[accent]单元[]来国防建筑并进攻敌军 . \n研究并放置一只 :ground-factory: [accent]陆军工厂[] . 
fungalpass.tutorial2 = 在陆军工厂中选择 :dagger: [accent]匕首[]单元。\n 制造三个匕首。
frontier.tutorial1 = :additive-reconstructor: [accent]数增级单元重构工厂[]\n利用 :silicon: 硅胶和 :graphite: 铅笔芯\n将输入的单元从一级升至二级 . \n\n研究 :mace: [accent]梅斯[]并将一个 :dagger: [accent]匕首[]重构为 :mace: [accent]梅斯[] . 
frontier.tutorial2 = 敌军波浪将会[accent]没有限制刷新[], 直至摧毁所有的敌方核心。
frontier.tutorial3 = [accent]抓紧进攻敌军基地，以防波浪过于凶猛。[]
atolls.destroy1 = 先摧毁两个的敌军[accent]次代[]核心。
atolls.mega1 = 进入[accent]指挥方式[]并选择 :mega: [accent]兆[]单元。
atolls.mega2 = 选择 \ue87b [accent]拾取单元[]命令, 让兆拾起地面单元。
atolls.mega3 = 将兆移动到单元[accent]上方[]来拾起它。
atolls.mega4 = [accent]在此处放下单元们来进攻。
atolls.mega5 = 选择 \ue879 [accent]卸载有效载荷[]命令来让兆放下它携带的单元 . 
atolls.mega6 = 当选中 \ue879 卸载有效载荷命令时, 单元们会[accent]自动被放下[]。
atolls.mega7 = 兆[accent]不会[]在墙壁体正上方或深的水处放下单元。
atolls.mega8 = [accent]在此处放下海军单元来进攻。[]
atolls.attack1 = 1：在此处放下地面单元们来进攻。
atolls.attack2 = 2：此外, 在这里放下海军单元来出奇制胜。
atolls.carry1 = 携带陆军单元们需求 :mega: [accent]兆[]
atolls.carry2 = 1：命令兆单元移动到地面单元[accent]上方[]。
atolls.carry3 = 2：选择 \ue87b [accent]拾取单元们[]命令, 来让兆拾起地面单元。
atolls.carry4 = 3：指挥而且移动[accent]携有单元[]的兆。
atolls.carry5 = 4：选择 \ue879 [accent]卸载有效载荷[]命令，来让兆放下它携带的单元。
atolls.carry6 = 能够再[accent]回顾这些步骤[]。
atolls.carry7 = 跟随指示，在敌军基地旁空的降单元。
atolls.noairunit = 这座基地防守森严，不是有能力去用空的军单元攻破。
atolls.2strategies = 有两种策略能够摧毁这座基地。
onset.mine = 咔哒墙壁们上的 :beryllium: [accent]贝里尔矿[]以手动开采 . \n\n使用[accent][[WASD]移动 . 
onset.mine.mobile = 咔哒墙壁们上的 :beryllium: [accent]贝里尔矿[]以手动开采。
onset.research = 打开 :tree: 技术树。\n研究 :turbine-condenser: [accent]涡轮冷凝器[]，并放置在通风口上。\n它能够产生[accent]功率[]。
onset.bore = 注意：研究并放置 :plasma-bore: [accent]等离子钻机[]。\n它能够自动挖掘墙壁上的资源。
onset.power = 为了给等离子钻机提供[accent]功率[]，研究并放置一个 :beam-node: [accent]激光节点[] . \n它会连接涡轮冷凝器与等离子钻机 . 
onset.ducts = 研究而且放置 :duct: [accent]项目管子[]将等离子钻机挖掘的矿物移至核心 . \n\n咔哒而且拖动以连续放置项目管子 . \n滚动[accent]耗子的轮子[]以转向 . 
onset.ducts.mobile = 研究并放置 :duct: [accent]项目们管子[]将等离子钻机挖掘的矿物移至核心 . \n\n长的按压一秒钟, 然后拖动以连续放置项目管子 . 
onset.moremine = 扩大挖掘规模。\n放置更多的的等离子钻机，并用激光节点与项目们管子来使它们正常工作。\n挖掘 200 贝里尔。
onset.graphite = 要建立更先进的建筑，需求 :graphite: [accent]铅笔芯[]。\n利用等离子钻机挖掘铅笔芯。
onset.research2 = 开始研究[accent]工厂[] . \n研究 :cliff-crusher: [accent]墙壁粉化器[]和 :silicon-arc-furnace: [accent]拱形硅胶炉[] . 
onset.arcfurnace = 拱形硅胶炉需求 :sand: [accent]沙滩[]与 :graphite: [accent]铅笔芯[]以冶炼 :silicon: [accent]硅胶[]。\n它也需求[accent]功率[]。
onset.crusher = 使用 :cliff-crusher: [accent]墙壁粉化器[]挖掘沙滩。
onset.fabricator = 使用[accent]单元[]探索卡片, 进行国防, 发动进攻。\n研究并放置一个 :tank-fabricator: [accent]坦克制造厂[]。
onset.makeunit = 制造单元 . \n咔哒“?”以显示制造单元所需资源 . 的说
onset.turrets = 利用单元国防很有效的, 但合理利用[accent]炮塔[]是有能力去供给更好的国防力。\n放置一个 :breach: [accent]撕裂[]。\n炮塔需求供给 :beryllium: [accent]弹药[]。
onset.turretammo = 给炮塔供给[accent]贝里尔[] . 
onset.walls = [accent]墙壁[]能够防止建筑受到损害。\n在炮塔周围放置一些:beryllium-wall:[accent]贝里尔墙壁[]。
onset.enemies = 敌军来袭，准备国防。
onset.defenses = [accent]建立国防：[lightgray] {0}
onset.attack = 敌军基地十分脆弱 . 发动反攻 . 
onset.cores = 您能够在[accent]核心地块[]上建立新的核心 . \n新核心的功能类似于前沿基地，且与其他核心共享资源拱顶 . \n放置一个 :core-bastion: 核心 . 
onset.detect = 敌军将在两分钟内发现您。\n设立国防, 挖掘矿物, 并建立制造设施。
onset.commandmode = 按住[accent]shift[]键进入[accent]指挥方式[]。\n按住[accent]耗子左边的按钮[]框选单元。\n[accent]正确的按钮[]指挥所选单元移动或者进攻。
onset.commandmode.mobile = 咔哒左下角的[accent]指挥[]进入[accent]指挥方式[] . \n按住屏幕，[accent]拖动[]框选单元 . \n[accent]咔哒[]指挥所选单元移动或进攻 . 
aegis.tungsten = 钨能够利用[accent]冲击钻[]进行开采 . \n该结构需求[accent]水[]和[accent]功率[] . 
split.pickup = 核心单元能够拾取一些方块。\n拾取这个[accent]强化的集装箱[]并将其放到[accent]有效载荷装货者[]中。\n（默认使用快的钥匙“[”拾取有效载荷, “]”放下载荷）
split.pickup.mobile = 核心单元能够拾取一些方块。\n拾取这个[accent]强化的集装箱[]而且将其放到[accent]有效载荷装货者[]中。\n（长的按压以拾取或者放下载荷）
split.acquire = 您需求获取钨来制造单元们。
split.build = 单元必须被运输到墙壁的另一侧 . \n在墙壁两侧各放置一个[accent]有效载荷质量驱动器[] . \n咔哒其中一个，然后咔哒另一个以连接它们 . 
split.container = 与强化集装箱类似，单元也能够使用[accent]有效载荷质量驱动器[]运输。\n在有效载荷质量驱动器旁放置单元工厂以向其装载单元，然后将单元运输到墙壁的另一侧，摧毁敌方基地。
item.copper.description = 用于所有类型的建立和弹药。
item.copper.details = 警察。在塞普罗行星上异常丰富的金属。除非被加强,结构上是弱的。
item.lead.description = 用于液体的运输和电的结构们。
item.lead.details = 密集的。惰性的。广泛地用于电池们。\n注意：可能对生物的生活形式有毒,并不是说这里还剩下很多。
item.metaglass.description = 用于建立输送或储存液体的的建筑。
item.graphite.description = 用于制造电子元件，或者作为炮塔弹药 . 
item.sand.description = 用于制造其他精炼材料。
item.coal.description = 用作燃料，或用于精炼材料制造 . 
item.coal.details = 似乎是植物的化石，在孢子出现很久前就形成了。 的说
item.titanium.description = 用于液体的输送建筑,演习和工厂。
item.thorium.description = 用于耐用的结构们以及作为核的燃料。
item.scrap.description = 被使用于在熔炉和粉化器中精炼成其他材料。
item.scrap.details = 残骸建筑和残留物的单元 . 
item.silicon.description = 用于太阳面板、复杂的电气元件或作为追踪性弹药。
item.plastanium.description = 被利用于高级单元、绝缘材料，或作为分散性弹药。
item.phase-fabric.description = 用于高级电子装置和自修复建筑。
item.surge-alloy.description = 用于先进武器和反应国防建筑 . 
item.spore-pod.description = 用于转化成石油、爆炸化合物或作为燃料。
item.spore-pod.details = 孢子。可能是人工合成的生活形式，释放对其他生物有毒的气体，极具侵略性。在某些情况下高度易燃。
item.blast-compound.description = 用作炸弹或爆炸性弹药 . 
item.pyratite.description = 用于烧焦发射类武器和使用燃料的发电装置。
item.beryllium.description = 被利用于埃里克尔的多种建筑和弹药。
item.tungsten.description = 用于演习,装甲和弹药。用于建立更先进的建筑。
item.oxide.description = 用作热导体和绝缘体 . 
item.carbide.description = 用于先进的建筑、重型单元和弹药。
liquid.water.description = 被使用于冷却机器和废物处理。
liquid.slag.description = 在分离器中提炼成金属成分，或作为武器弹药喷朝向敌军。
liquid.oil.description = 用于先进材料制造和喷射类武器。
liquid.cryofluid.description = 用作反应器、炮塔和工厂的冷却剂。
liquid.arkycite.description = 用于发电和合成材料的化学反应 . 
liquid.ozone.description = 注意：用作材料制造的氧化剂和燃料 . 有一定爆炸性 . 
liquid.hydrogen.description = 被利用于资源开采、单元制造和结构修复。易燃。
