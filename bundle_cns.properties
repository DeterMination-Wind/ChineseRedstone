sector.onset.description = 收集瑞索斯, 瑞瑟奇的泰克以自动化普罗杜斯。\n开始进攻。
sector.aegis.description = 这个扇区有钨矿床分布。\n瑞瑟奇[accent]冲击演习[]挖掘钨，而且摧毁这里的敌方基地。
sector.lake.description = 这个扇区的岩浆湖限制了大零件尤尼特的移动，悬浮尤尼特是唯一选择 . \n尽快瑞瑟奇[accent]飞船制造厂[]而且普罗杜斯一只[accent]躲避[] . 
sector.intersect.description = 扫描显示出, 这个扇区在着陆后不久将受到多方朝向的进攻。\n迅速建立国防的并尽快扩张。\n[accent]机甲[]尤尼特可用的于在这里的崎岖地形活动。
sector.atlas.description = 这个扇区包含各种地形，需求多兵种配合进行有效的进攻。\n这里发现的一些更为坚固的敌方基地需求利用高级尤尼特摧毁。\n瑞瑟奇[accent]电解器[]和[accent]坦克重构厂[]。
sector.split.description = 这个扇区的敌军数量很少，非常适合测试新的运输技术。
sector.basin.description = 这个扇区探测到了大量敌军。\n快速普罗杜斯尤尼特并攻占敌方科尔以在该地立足。
sector.marsh.description = 这个的扇区有大量芳香油, 但通风口数量有限 . \n利用[accent]化学正在燃烧室[]发电 . 
sector.peaks.description = 这个的扇区的山区地形使大零件尤尼特的毫没有任何东西用处 . 需求使用空的军尤尼特 . \n通知敌军的防空的设施 . 尝试切断它的供弹 . 
sector.ravine.description = 这里是重要的运输的敌军路线 . 扇区们中未探测到敌方科尔, 但预计会有多种敌军 . \n尽快普罗杜斯[accent]激增合金[]并比尔德[accent]劫难[]图雷特 . 
sector.caldera-erekir.description = 这个扇区的瑞索斯的分散在多个岛屿上。\n瑞瑟奇并部署没有任何东西人机运输。
sector.stronghold.description = 这个的扇区的敌方基地守卫着大量的[accent]雷神[]。\n使用它瑞瑟奇的高级尤尼特和图雷特。
sector.crevice.description = 这个扇区们攻势非常的敌军猛烈。\n尽快瑞瑟奇[accent]碳化物[]与[accent]热解生成器[]以求得生存。
sector.siege.description = 这个扇区中的两条平行的山谷使你不得不进行双线作战 . \n瑞瑟奇[accent]氰气[]以普罗杜斯更强大的坦克尤尼特 . \n警报：探测到敌方长距离的导弹塔 . 导弹打击前可被拦截 . 
sector.crossroads.description = 这个扇区的敌方基地建立在不同的地形上 . 尝试瑞瑟奇多种尤尼特以进攻 . \n某些敌方基地有希尔德被保护 . 尝试切断它们的供电 . 的说
sector.karst.description = 这个扇区瑞索斯的丰富，但敌军会立刻发动进攻。\n充分利用瑞索斯并瑞瑟奇[accent]阶段布[]。
sector.origin.description = 最终扇区，敌军数量极多 . \n所有的泰克均已经被瑞瑟奇完毕，只需摧毁所有的敌方基地 . 
