laccess.color = 发光者发光的颜色
laccess.controller = 尤尼特的的控制方\n如果尤尼特由普罗塞瑟控制，返回对应的普罗塞瑟\n如果尤尼特在队形中，返回队形的领队\n其他情况，返回尤尼特自身
laccess.dead = 尤尼特的或比尔多的是否已被摧毁或者已失效
laccess.controlled = 若尤尼特的的控制方是普罗塞瑟，返回 [accent]@ctrlProcessor[]\n若尤尼特/比尔多由普雷尔控制，返回 [accent]@ctrlPlayer[]\n若尤尼特在队形中，返回 [accent]@ctrlFormation[]\n其他情况，返回 0
laccess.progress = 进步，0 到 1 之间的数值 . \n返回工厂普罗杜斯、图雷特的装填，或者比尔多比尔德的进步
laccess.speed = 最高斯皮德的的尤尼特（格/秒钟）
laccess.size = 尤尼特/比尔多的大和小或绳子的长度
laccess.id = 尤尼特/块/艾特姆/液体的的 ID . \n这是 Lookup 的反向操作 . 
laccess.displaywidth = 显示屏的宽度（以像素为尤尼特） . 
laccess.displayheight = 显示屏的高度（以像素为尤尼特）。
laccess.buffersize = 显示出器图形缓冲区中未处理的命令数。
laccess.operations = 布洛克执行操作的次数。\n对于显示屏, 返回 drawflush 调用次数。
laccess.maxunits = 队伍能拥有的最大的尤尼特的数。\n只能从科尔中读。
