sector.origin.name = 起源
sector.onset.description = 收集资源, 研究技术以自动化制造 . \n开始进攻 . 
sector.aegis.description = 这个扇区有钨矿床分布。\n研究[accent]冲击演习[]挖掘钨，而且摧毁这里的敌方基地。
sector.lake.description = 这个扇区的岩浆湖限制了大部分单元的移动，悬浮单元是唯一选择。\n尽快研究[accent]飞船制造厂[]而且制造一个[accent]躲避[]。
sector.intersect.description = 扫描显示出，这个扇区在着陆后不久将受到多方朝向的进攻 . \n迅速建立国防并尽快扩张 . \n[accent]机甲[]单元可用的于在这里的崎岖地形活动 . 
sector.atlas.description = 这个扇区包含各种地形，需求多兵种配合进行有效的进攻。\n这里发现的一些更为坚固的敌方基地需求利用高级单元摧毁。\n研究[accent]电解器[]和[accent]坦克重构厂[]。
sector.split.description = 这个扇区的敌军数量很少，非常适合测试新的运输技术。
sector.basin.description = 这个扇区探测到了大量敌军 . \n快速制造单元并攻占敌方核心以在该地立足 . 
sector.marsh.description = 这个的扇区有大量芳香油，但通风口数量有限 . \n利用[accent]化学正在燃烧室[]发电 . 
sector.peaks.description = 这个的扇区的山区地形使大部分单元毫没有任何东西用处。需求使用空的军单元。\n通知敌军的防空的设施。尝试切断它的供弹。
sector.ravine.description = 这里是重要的运输的敌军路线。扇区中未探测到敌方核心, 但预计会有多种敌军。\n尽快制造[accent]激增合金[]并建立[accent]劫难[]炮塔。 的说
sector.caldera-erekir.description = 这个扇区的资源分散在多个岛屿上。\n研究并部署没有任何东西人机运输。
sector.stronghold.description = 这个的扇区的敌方基地守卫着大量的[accent]雷神[]。\n使用它研究高级单元和炮塔。
sector.crevice.description = 这个扇区攻势非常的敌军猛烈。\n尽快研究[accent]碳化物[]与[accent]热解生成器[]以求得生存。
sector.siege.description = 这个扇区中的两条平行的山谷使你不得不进行双线作战 . \n研究[accent]氰气[]以制造更强大的坦克单元 . \n警报: 探测到敌方长距离导弹塔 . 导弹打击前可被拦截 . 
sector.crossroads.description = 注意：这个扇区的敌方基地建立在不同的地形上。尝试研究多种单元以进攻。\n某些敌方基地有盾牌被保护。尝试切断它们的供电。
