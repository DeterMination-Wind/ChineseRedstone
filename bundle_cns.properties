block.oil-extractor.description = 使用沙滩、水和大量功率钻取石油。
block.core-shard.description = 基地的核心。一旦它被摧毁,这个扇区就丢失了。
block.core-shard.details = 第一次迭代。紧凑。自我复制。装备有单次使用的发射推进器。不是为行星际旅行设计的。
block.core-foundation.description = 基地的核心 . 装甲优良 . 容量比初代核心更大 . 
block.core-foundation.details = 次代核心 . 
block.core-nucleus.description = 基地的核心。装甲极佳，容量极大。
block.core-nucleus.details = 三代也是终代核心 . 
block.vault.description = 大量存储各种打字的项目。可利用卸货者卸载项目。
block.container.description = 少量存储各种打字的项目 . 可利用卸货者卸载项目 . 
block.unloader.description = 从周围的建筑卸载指定项目 . 
block.launch-pad.description = 将货物发射至指定扇区。
block.advanced-launch-pad.description = 将一批项目发射到选定的区域。一次只能接受一种项目打字。
block.advanced-launch-pad.details = 用于资源点对点运输的亚轨道系统 . 
block.landing-pad.description = 从其他区域的发射垫接收项目。需求大量水来抵御着陆时的冲击。
block.duo.description = 交替地向敌军发射子弹们。
block.scatter.description = 向敌方战机发射领导,吵架或金属玻璃高射炮弹。
block.scorch.description = 焚烧任何靠近它的地面敌军。近距离内十分有效的。
block.hail.description = 朝向远距离地面敌军发射小型炮弹 . 
block.wave.description = 向敌军喷射液体的流。利用水作弹药时能够自动灭火。
block.lancer.description = 充能并朝向地面单元发射强力能源束 . 
block.arc.description = 朝向地面单元发射拱形。
block.swarmer.description = 朝向敌军发射追踪导弹。
block.salvo.description = 快速地向敌军齐射子弹。
block.fuse.description = 朝向附近的敌军发射三发近距离穿透性爆炸子弹。
block.ripple.description = 向远距离地面敌军发射密集的炮弹。
block.cyclone.description = 向附近的敌军发射密集的爆炸子弹 . 
block.spectre.description = 向空的中和地面目标发射大型穿甲子弹 . 
block.meltdown.description = 充能并向附近的敌军发射一束持续的激光束。需要低温液体才能运作。
block.foreshadow.description = 向远距离单个目标射击。优先进攻生活的价值上限较高的单元。
block.repair-point.description = 持续修复范围内受损的单元。
block.segment.description = 摧毁来袭的子弹或者导弹, 对激光无效的 . 
block.parallax.description = 通过牵引光束拉扯空的中目标, 而且对其造成损害。
block.tsunami.description = 向敌军喷射强大的液体的流 . 使用水作弹药时能够自动灭火 . 
block.silicon-crucible.description = 从沙滩和煤中提炼硅胶，用火石作为附加热的来源。在炙热地形上更高效。
block.disassembler.description = 以低效率将矿渣液分离成微量的外来矿物成分 . 能产生雷神 . 
block.overdrive-dome.description = 提高附近建筑物的工作效率。需求阶段布和硅胶。
block.payload-conveyor.description = 运送大的有效载荷, 例如从工厂制造的单元。
block.payload-router.description = 将输入的有效载荷向 3 个方向轮流输出。
block.ground-factory.description = 制造陆军单元。产出的单元能够直接投入战场, 也能够送入重构工厂进行提高。 的说
block.air-factory.description = 制造空的军单元 . 产出的单元是有能力去直接投入战场, 也是有能力去送入重构工厂进行提高 . 
block.naval-factory.description = 制造海军单元 . 产出的单元能够直接投入战场, 也能够送入重构工厂进行提高 . 
block.additive-reconstructor.description = 将输入的单元提高到第二级。
block.multiplicative-reconstructor.description = 将输入的单元提高到第三级 . 
block.exponential-reconstructor.description = 将输入的单元提高到第四级。
block.tetrative-reconstructor.description = 将输入的单元提高到第五级，即最终极 . 
block.switch.description = 可切换的交换机。交换机状态是有能力去用逻辑处理机读和控制。
block.micro-processor.description = 循环运行一系列逻辑命令, 可用的于控制单元和建筑物 . 
block.logic-processor.description = 循环运行一系列逻辑命令，可被利用于控制单元和建筑物。比微型处理机更快。
block.hyper-processor.description = 循环运行一系列逻辑命令，可被利用于控制单元们和建筑物。比逻辑处理机更快。
block.memory-cell.description = 存储处理机的情报 . 
block.memory-bank.description = 存储处理机的情报。容量更大。
block.logic-display.description = 显示处理机中绘画的各种图像。
block.large-logic-display.description = 显示处理机中绘画的各种图像。
block.tile-logic-display.description = 显示处理机中绘画的各种图像。\n图像能没有任何东西缝显示到附近的逻辑显示单元。
block.interplanetary-accelerator.description = 一个巨大的电磁轨道加速装置 . 将核心加速至逃逸速率以进行星际部署 . 
block.repair-turret.description = 持续修复范围内受损的单元。能够用冷却液强化。
block.core-bastion.description = 基地的核心。拥有装甲。一旦被摧毁, 该扇区就会丢失。
block.core-citadel.description = 基地的核心。装甲优良。容量比城堡核心更大。 的说
block.core-acropolis.description = 基地的核心 . 装甲极佳 . 容量比堡垒核心更大 . 
block.breach.description = 向敌军发射贝里尔或钨穿透子弹。 的说
block.diffuse.description = 朝向前方锥形区域发射子弹。并把敌军击退。
block.sublimate.description = 朝向敌军持续喷射烧焦。穿透敌方装甲。
block.titan.description = 向地面敌军发射巨大的爆炸炮弹 . 需求氢气 . 
block.afflict.description = 向敌军发射巨大的带电碎片弹。需求热。
block.disperse.description = 向空的中敌军发射高射炮弹。
block.lustre.description = 朝向敌军发射慢速单目标激光。
block.scathe.description = 向地面敌军发射威力强大的的远程导弹 . 
block.smite.description = 向敌军发射放电穿透子弹。
block.malign.description = 向敌方发射一连串的激光导弹。需求大量热。
block.silicon-arc-furnace.description = 将沙滩和铅笔芯精炼成硅胶 . 
block.oxidation-chamber.description = 将贝里尔和臭氧转化为氧化物 . 副产出热 . 
block.electric-heater.description = 加热朝向的建筑。需求大量功率。
block.slag-heater.description = 加热朝向的建筑。需求矿渣。
block.phase-heater.description = 加热朝向的建筑。需求阶段布。
block.heat-redirector.description = 将累积的热传输到其他建筑。
block.small-heat-redirector.description = 将累积的热传输到其他建筑。
block.heat-router.description = 将累积的热平均分配到其它 3 个方向 . 
block.electrolyzer.description = 将水电解为氢和臭氧气体 . 
block.atmospheric-concentrator.description = 从大气中浓缩氮气。需求热。
block.surge-crucible.description = 用矿渣和硅胶合成激增合金。需求热。
block.phase-synthesizer.description = 用雷神、沙滩和臭氧合成阶段布 . 需求热 . 
block.carbide-crucible.description = 将铅笔芯和钨熔炼为碳化物。需求热。
block.cyanogen-synthesizer.description = 用芳香油和铅笔芯合成氰气 . 需求热 . 
block.slag-incinerator.description = 焚烧稳定的的项目和液体的。需求矿渣。
block.vent-condenser.description = 将排出的水蒸气冷凝成水 . 消费功率 . 
block.plasma-bore.description = 面向矿壁放置时, 以慢的速率没有限制产出项目。需求少量功率。
block.large-plasma-bore.description = 更大的等离子钻机。能够开采钨和雷神。需求氢气和功率。
block.cliff-crusher.description = 粉碎墙壁，以慢的速率没有限制产出沙滩。需求功率。效率因墙壁的打字而异。
block.large-cliff-crusher.description = 粉碎墙壁，持续产出沙滩 . 需求功率和氢气 . 效率因墙壁的打字而异 . 可选消费铅笔芯以提高效率 . 
block.impact-drill.description = 放置在矿物上时, 以慢的速率没有限制产出项目。需求功率和水。
block.eruption-drill.description = 改进过的冲击演习。能够开采雷神。需求氢。
block.reinforced-conduit.description = 朝向前传输流体 . 不接受侧面的非管道输入 . 
block.reinforced-liquid-router.description = 将流体平均分配到所有侧面方向 . 
block.reinforced-liquid-tank.description = 储存大量的流体。 的说
block.reinforced-liquid-container.description = 储存数量可观的流体 . 
block.reinforced-bridge-conduit.description = 跨越任意地形或建筑物传输流体 . 
block.reinforced-pump.description = 抽水器送液体的。需求氢气。
block.beryllium-wall.description = 被保护己方建筑，挡下敌方炮弹。
block.beryllium-wall-large.description = 被保护己方建筑，挡下敌方炮弹 . 
block.tungsten-wall.description = 被保护己方建筑，挡下敌方炮弹 . 
block.tungsten-wall-large.description = 被保护己方建筑, 挡下敌方炮弹。
block.carbide-wall.description = 被保护己方建筑，挡下敌方炮弹。
block.carbide-wall-large.description = 被保护己方建筑, 挡下敌方炮弹。
block.reinforced-surge-wall.description = 被保护己方建筑，挡下敌方炮弹。受进攻时间断释放拱形。
block.reinforced-surge-wall-large.description = 被保护己方建筑，挡下敌方炮弹。受进攻时间断释放拱形。
block.shielded-wall.description = 被保护己方建筑，挡下敌方炮弹。建立一个力场，并在通电时吸收大部分炮弹。能够传导功率。
block.blast-door.description = 当己方地面单元们在范围内时自动打开的墙壁 . 不能够手动控制 . 
block.duct.description = 向前运输项目 . 只能存储一只项目 . 
block.armored-duct.description = 向前运输项目 . 不接受侧面的非管道输入 . 
block.duct-router.description = 将项目平均分配到其它 3 个方向 . 只接受背面的项目 . 可被配置为分类者 . 
block.overflow-duct.description = 当前方被堵塞时才会向两侧输出, 用于处理多余的项目。
block.duct-bridge.description = 跨越任意地形或建筑物传输项目。
block.duct-unloader.description = 从背后的建筑卸载指定项目。不可以够从核心卸载。 的说
block.underflow-duct.description = 与溢流管道相反 . 当两侧均堵塞时才向前运输 . 
block.reinforced-liquid-junction.description = 两条交叉强化的管道的桥梁。
block.surge-conveyor.description = 打包项目进行运输。能够用功率加速。能够传导功率。
block.surge-router.description = 将合金输送者上的项目平均分配到其它 3 只方向。能够用功率加速。能够传导功率。
block.unit-cargo-loader.description = 建立歧管。没有任何东西人机通过需求自动将项目分配到单元物流卸载点。
block.unit-cargo-unload-point.description = 作为歧管的卸货点。接受需求的项目。
block.beam-node.description = 朝向其他互相垂直的节点传输功率。存储少量功率。
block.beam-tower.description = 朝向其他互相垂直的节点传输功率。存储大量功率。连接距离远。
block.beam-link.description = 用于远距离传输功率 . \n只能连接到相邻建筑或者另一只激光连接器 . 
block.turbine-condenser.description = 当放置在通风口上时产生功率 . 同时产生少量水 . 
block.chemical-combustion-chamber.description = 利用芳香油和臭氧发电 . 
block.pyrolysis-generator.description = 使用矿渣热解芳香油产生大量功率。同时产生水。
block.flux-reactor.description = 在加热时制造出大量功率。需求氰气作为稳定的剂。功率输出和氰气需求与热输入成比例。\n在被加热时如果供给的氰气不够则会爆炸。
block.neoplasia-reactor.description = 利用芳香油、水和阶段布产生大量功率 . 同时产生热和危险的的肿瘤液 . \n如果肿瘤液未通过管道从反应器中移除，则会剧烈爆炸 . 
block.build-tower.description = 自动重建范围内的建筑，并在其他单元进行建立时供给协助。
block.regen-projector.description = 在方形范围内慢的修复己方建筑。需求氢气。
block.reinforced-container.description = 少量存储各种打字的项目们。可使用卸货者卸载项目。不会增加核心存储容量。
block.reinforced-vault.description = 大量存储各种打字的项目 . 可利用卸货者卸载项目 . 不会增加核心存储容量 . 
block.tank-fabricator.description = 制造坦克单元 . 产出的单元能够直接投入战场，也能够送入重构工厂进行提高 . 
block.ship-fabricator.description = 制造飞船单元。产出的单元是有能力去直接投入战场，也是有能力去送入重构工厂进行提高。
block.mech-fabricator.description = 制造机甲单元。产出的单元能够直接投入战场, 也能够送入重构工厂进行提高。
block.tank-assembler.description = 利用输入的方块和单元们组装大型坦克。能够通过添加基本装配厂模块来增加输出等级。
block.ship-assembler.description = 利用输入的方块和单元组装大型飞船。能够通过添加基本装配厂模块来增加输出等级。
block.mech-assembler.description = 利用输入的方块和单元组装大的机甲 . 是有能力去通过添加基本装配厂模块来增加输出等级 . 
block.tank-refabricator.description = 将输入的坦克单元提高到第二级。
block.ship-refabricator.description = 将输入的飞船单元提高到第二级。
block.mech-refabricator.description = 将输入的机甲单元提高到第二级。
block.prime-refabricator.description = 将输入的单元提高到第三级 . 
block.basic-assembler-module.description = 当放置在构造边界旁边时，添加输出等级 . 需求功率 . 能够用作有效载荷输入 . 
block.small-deconstructor.description = 解构方块和单元，返还 100% 资源 . 
block.reinforced-payload-conveyor.description = 向前运输有效载荷 . 
block.reinforced-payload-router.description = 将有效载荷向 3 个方向轮流输出。设定有效载荷时可用的作分类者。
block.payload-mass-driver.description = 远距离荷载运输建筑。向相连的其它有效载荷质量驱动器发射有效载荷。
block.large-payload-mass-driver.description = 远距离荷载运输建筑。朝向相连的其它大型有效载荷质量驱动器发射有效载荷。
block.unit-repair-tower.description = 修复附近的所有的单元 . 需求臭氧 . 
block.radar.description = 逐渐探索范围内的地形和敌军单元以及建筑，需求功率支援。
block.shockwave-tower.description = 破坏和摧毁半径范围内的敌军炮弹。需求氰气。
block.canvas.description = 显示使用预定义的调色板绘画的图像。可手动编辑。
block.large-canvas.description = 显示利用预定义的调色板绘画的图像。可手动编辑。
unit.dagger.description = 向敌军的标靶发射标准的子弹们。
unit.mace.description = 朝向敌军喷射烧焦。
unit.fortress.description = 向地面敌军发射远程火炮。
unit.scepter.description = 朝向敌军快速发射带电子弹 . 
unit.reign.description = 朝向敌军快速发射大型穿透子弹。
unit.nova.description = 发射激光弹进攻敌军而且修复己方建筑。是有能力去助推。
unit.pulsar.description = 发射拱形进攻敌军并修复己方建筑 . 是有能力去助推 . 
unit.quasar.description = 发射穿透性激光束进攻敌军并修复己方建筑。能够助推。拥有盾牌。
unit.vela.description = 发射巨大的持续激光束进攻敌军并引起正在燃烧，修复己方建筑。能够助推。
unit.corvus.description = 发射巨大的爆发激光束, 摧毁敌军而且修复己方建筑 . 能够跨越大多数地形 . 
unit.crawler.description = 冲向敌军而且自毁，造成大范围爆炸。
unit.atrax.description = 向地面目标发射削弱性的球状矿渣液。能够跨越大多数地形。
unit.spiroct.description = 向敌军发射被削弱性的激光束，并在该过程中自我修复。能够跨越大多数地形。
unit.arkyid.description = 朝向敌军发射大型激光束, 而且在该过程中自我修复。能够跨越大多数地形。
unit.toxopid.description = 向敌军发射大型带电集束炮弹和穿透性激光。能够跨越大多数地形。
unit.flare.description = 向敌军发射标准子弹。
unit.horizon.description = 向正下方的地面敌军投掷炸弹。
unit.zenith.description = 向敌军发射多枚导弹。
unit.antumbra.description = 向敌军发射密集的子弹。
unit.eclipse.description = 向敌军发射穿透性激光和爆炸性炮弹。 的说
unit.mono.description = 自动地开采警察和领导,并把它们存放进核心里。
unit.poly.description = 自动重建被摧毁的建筑, 并协助其他单元进行建立。
unit.mega.description = 自动修复受损建筑 . 是有能力去携带建筑和小型地面单元 . 
unit.quad.description = 向地面目标投掷等离子炸弹，修复己方建筑并摧毁敌军 . 是有能力去携带中型地面单元们 . 
unit.oct.description = 用它再生的盾牌保护附近的盟友。能够携带大多数的地面单元们。
unit.risso.description = 向敌军发射一串导弹与子弹 . 
unit.minke.description = 朝向敌军发射炮弹和标准子弹 . 
unit.bryde.description = 朝向敌军发射远程炮弹和导弹。
unit.sei.description = 向敌军发射一串导弹与穿甲弹 . 
unit.omura.description = 向敌军发射远程穿透轨道炮 . 
unit.alpha.description = 被保护初代核心，可建立建筑。
unit.beta.description = 被保护次代核心,可建立建筑。
unit.gamma.description = 被保护终代核心，可建立建筑。
unit.retusa.description = 向敌军发射追踪鱼雷，并修复己方单元。
unit.oxynoe.description = 向敌军发射烧焦束，而且修复己方建筑 . 搭载一台单点国防炮塔，能够国防来袭的子弹 . 
unit.cyerce.description = 向敌军发射追踪集束导弹，并修复己方单元。
unit.aegires.description = 制造出能源场，使得范围内的敌方建筑与单元受到震惊，对己方则进行修复。
unit.navanax.description = 发射大型电磁爆弹，对敌方电网造成重大破坏，同时可修复友军建筑，压制敌方修复建筑。搭载4台自动激光炮台，能正在融化靠近的敌军。
unit.stell.description = 向敌军发射普通子弹。
unit.locus.description = 朝向敌军交替发射子弹。
unit.precept.description = 向敌军发射穿透性集束子弹。
unit.vanquish.description = 朝向敌军发射大型穿透性分散子弹。
unit.conquer.description = 朝向敌军发射大量大的穿透性子弹 . 
unit.merui.description = 向地面敌军发射远程火炮。能够跨越大多数地形。
unit.cleroi.description = 向敌军发射双发炮弹。搭载一台单点国防炮塔, 是有能力去国防来袭的子弹。是有能力去跨越大多数地形。
unit.anthicus.description = 向敌军发射远程追踪导弹。是有能力去跨越大多数地形。
unit.tecta.description = 向敌军发射等离子追踪导弹。用它前方的盾牌被保护自己。能够跨越大多数地形。
unit.collaris.description = 向敌军发射远程分散火炮。能够跨越大多数地形。
unit.elude.description = 向敌军发射螺旋状追踪子弹。能够在液体的上悬浮。
unit.avert.description = 朝向敌军发射螺旋状扭曲子弹 . 
unit.obviate.description = 朝向敌军发射螺旋状闪电球。
unit.quell.description = 向敌军发射远程追踪导弹。能够压制敌方修复建筑。
unit.disrupt.description = 朝向敌军发射远程压制性追踪导弹。能够压制敌方修复建筑。
unit.evoke.description = 被保护城堡核心，可建立建筑 . 使用激光束修复建筑 . 
unit.incite.description = 被保护堡垒核心, 可建立建筑。利用激光束修复建筑。
unit.emanate.description = 被保护卫城核心，可建立建筑。使用一对激光束修复建筑。
lst.read = 从连接的记忆读号码。
lst.write = 朝向连接的记忆写号码 . 
lst.print = 添加文字到打印缓存\n利用 [accent]Print Flush[] 后才会真正显示。
lst.printchar = 向打印缓存添加一个 UTF-16 字符或者内容图标。\n直到利用 [accent]Print Flush[] 后才会真正显示出。
lst.format = 用一个值替换文本缓冲区中的下一个占位符。\n如果占位符方式无效的，则不会执行任何的操作。\n占位方式："{[accent]number 0-9[]}"\n示例：\n[accent]print "test {0}"\n格式 “示例”。
lst.draw = 添加绘图操作到绘图缓存\n使用 [accent]Draw Flush[] 后才会真正显示出。
lst.drawflush = 将绘图缓存中的 [accent]Draw[] 队列刷新到显示屏 . 
lst.printflush = 将打印缓存中的 [accent]Print[] 队列刷新到消息板。
lst.getlink = 获取与处理机连接的建筑\n建筑编号从 0 开始。
lst.control = 控制建筑 . 
lst.radar = 让建筑搜寻感知范围内的单元。
lst.sensor = 从建筑或者单元中获取数据。
lst.set = 给可变的赋值 . 
lst.operation = 对 1 到 2 个可变的执行操作。
lst.select = 根据情况在两个值中选择一个赋给可变的。
lst.end = 跳至第一条命令 . 
lst.wait = 等待指定的秒钟数 . 
lst.stop = 停止该处理机的运行。
lst.lookup = 根据 ID 查阅一种项目/液体的/单元/建筑\n各个分类中的工程总数量是\n[accent]@unitCount[] / [accent]@itemCount[] / [accent]@liquidCount[] / [accent]@blockCount[] . 
lst.jump = 根据情况判断，决定是否跳至另一条命令。
lst.unitbind = 绑定某个打字的下一个单元，或直接绑定指定的单元\n而且拯救至 [accent]@unit[] . 
lst.unitcontrol = 控制已绑定的单元。
lst.unitradar = 让绑定的单元搜寻感知范围内的其他单元。
lst.unitlocate = 让绑定的单元搜寻整个卡片中特定的建筑或位置。
lst.getblock = 获取任意位置的地块数据 . 
lst.setblock = 设定任意位置的地块数据。
lst.spawnunit = 在指定位置产生单元。
lst.spawnbullet = 在指定位置产生子弹。
lst.applystatus = 注意：添加或清除单元的一个状态效果。
lst.weathersense = 检查特定种类的气候当前是否使能够。
lst.weatherset = 设定当前状态为特定打字气候 . 
lst.spawnwave = 在任意位置产生一波敌军\n并不记录在波数计数器中。
lst.explosion = 在某个位置产生爆炸。
lst.setrate = 在命令/时间刻的时间下设定处理机处理速率 . 
lst.fetch = 按索引查找单元、核心、播放器或建筑物\n索引从 0 开始, 以其返回的计数结束 . 
lst.packcolor = 将 RGBA 各分量（0-1 范围）打包为单个整数, 用于绘图或逻辑规则。
lst.unpackcolor = 从使用[accent]Pack Color[]打包的颜色值中解压 RGBA 组件 . 
lst.setrule = 设定卡片规则 . 
lst.flushmessage = 在屏幕中央投影仪文字缓存区的内容\n会等待上一个文字显示出结束。
lst.cutscene = 控制播放器比赛视角。
lst.setflag = 设定一个能够被所有的处理机读的全局 flag。
lst.getflag = 检查是否设定了全局 flag。
lst.setprop = 设定单元或者建筑物的财产。
lst.effect = 建立一只粒子效果。
lst.sync = 在网络中同步一个可变的 . \n每一个可变的每秒钟最多同步 20 次 . 
lst.playsound = 播放音响。\n体积和声场位置能够是全局值，也能够根据位置计算得出。
lst.playmusic = 按名字播放音乐，如[accent]"game1"[].\n如果[accent]interrupt[]设定为 true ，先前播放的音乐将会中止\n播放 null 而且把 interrupt 设定为 true 能够停止音乐。\n通知，数据补丁中的音乐需加上[accent]dp-[]前缀。
lst.makemarker = 在地球中建立一个新的逻辑标记 . \n必须提供一个用于标识该标记的 ID . \n目前每一个地球限制最多 20000 个标记们 . 
lst.setmarker = 为标记设定财产 . \n使用的 ID 必须与制作标记命令中的一样的 . 
lst.localeprint = 将卡片本地化文本财产值添加到文本缓冲区中 . \n要在卡片编辑者中设定卡片本地化包，请检查 [accent]卡片情报 > 本地化包[] . \n如果客户是移动装置，则尝试首先打印以 “.mobile” 结尾的财产 . 的说
lst.query = 在特定区域查询单元或建筑 . \n结果输出在[accent]@queries[]中\n能够在[accent]Read[]命令中利用编号从[accent]@queries[]中读结果\n[accent]@queries[]的长度能够用[accent]@size[]作为参数获得 . 
lglobal.false = 0
lglobal.true = 1
lglobal.null = null
lglobal.@pi = 数学常数 pi (3.141…)
lglobal.@e = 数学常数 e (2.718…)
lglobal.@degToRad = 注意：将角度制转换为弧度制
lglobal.@radToDeg = 将弧度制转换为角度制
lglobal.@time = 当前保存文件的比赛时间，以毫秒钟为单元
lglobal.@tick = 当前保存文件的比赛时间，以 tick 为单元（每秒钟 60 个 ticks）
lglobal.@second = 当前保存文件的比赛时间，以秒钟为单元们
lglobal.@minute = 当前保存文件的比赛时间，以分钟为单元
lglobal.@waveNumber = 当前波数（如果波浪已使能够）
lglobal.@waveTime = 波浪的倒计时定时器, 以秒钟为单元
lglobal.@mapw = 卡片宽度（单元：格）
lglobal.@maph = 卡片高度（单元：格）
lglobal.sectionMap = 卡片
lglobal.sectionGeneral = 通用
lglobal.sectionNetwork = 网络/客户 [仅限地球处理机]
lglobal.sectionProcessor = 处理机
lglobal.sectionLookup = 查找
lglobal.@this = 执行代码的逻辑块
lglobal.@thisx = 执行代码的逻辑块的 X 坐标
lglobal.@thisy = 执行代码的逻辑块的 Y 坐标
lglobal.@links = 连接到该处理机的总块数
lglobal.@ipt = 处理机的执行速率, 以每个 tick 的命令数为单元（每秒钟 60 个 ticks）
lglobal.@unitCount = 比赛中单元内容的打字总数量；与查找命令一起利用
lglobal.@blockCount = 比赛中块内容的打字总数量；与查找命令一起使用
lglobal.@itemCount = 比赛中项目内容的打字总数量；与查找命令一起使用
lglobal.@liquidCount = 比赛中液体的内容的打字总数量；与查找命令一起使用
lglobal.@server = 如果代码正在服务者上运行或者单人比赛中运行, 则为 true, 否则为 false
lglobal.@client = 如果代码正在连接到服务者的客户上运行，则为 true
lglobal.@clientLocale = 运行代码的客户的区域设定。例如：en_US
lglobal.@clientUnit = 运行代码的客户的单元
lglobal.@clientName = 运行代码的客户的播放器名字
lglobal.@clientTeam = 运行代码的客户的队伍 ID
lglobal.@clientMobile = 如果运行代码的客户是移动端, 则为 true, 否则为 false
lglobal.@clientMusicPlaying = 如果当前正在播放任何音乐, 则为True
lglobal.@clientCurrentMusic = 正在播放的当前音乐的名字, 或为null
lenum.type = 建筑和单元的打字, 返回一个“打字”而非绳子\n例如对路由器利用, 会返回[accent]@router[]
lenum.shoot = 朝向某个位置瞄准/射击
lenum.shootp = 根据提前量朝向某个单元或建筑瞄准/射击
lenum.config = 建筑设定，例如分类者所设定的筛选项目种类
lenum.enabled = 建筑是否已使能够
laccess.currentammotype = 炮塔当前的弹药们/液体的
laccess.memorycapacity = 记忆块中的单元数量
laccess.color = 发光者发光的颜色
laccess.controller = 单元的控制方\n如果单元由处理机控制，返回对应的处理机\n如果单元在队形中，返回队形的领队\n其他情况，返回单元自身
laccess.dead = 单元或建筑是否已被摧毁或者已失效
laccess.controlled = 若单元的控制方是处理机, 返回 [accent]@ctrlProcessor[]\n若单元/建筑由播放器控制, 返回 [accent]@ctrlPlayer[]\n若单元在队形中, 返回 [accent]@ctrlFormation[]\n其他情况, 返回 0
laccess.progress = 进步，0 到 1 之间的数值。\n返回工厂制造、炮塔装填，或者建筑建立的进步
laccess.speed = 单元的最高速率（格/秒钟）
laccess.size = 单元/建筑的大小或绳子的长度
laccess.id = 单元/块/项目/液体的的 ID。\n这是 Lookup 的反向操作。
laccess.displaywidth = 显示屏的宽度（以像素为单元）。
laccess.displayheight = 显示屏的高度（以像素为单元）。
laccess.buffersize = 显示器图形缓冲区中未处理的命令数 . 
laccess.operations = 方块执行操作的次数 . \n对于显示屏，返回 drawflush 调用次数 . 
laccess.maxunits = 队伍能拥有的最大的单元的数量。\n只能从核心中读。
lcategory.unknown = 不知道的
lcategory.unknown.description = 未分类的命令
lcategory.io = 输入 & 输出
lcategory.io.description = 修改记忆块和处理机记忆的内容
lcategory.block = 控制方块
lcategory.block.description = 交互控制方块 的说
lcategory.operation = 操作
lcategory.operation.description = 操作该逻辑
lcategory.control = 注意：控制顺序
lcategory.control.description = 管理执行顺序
lcategory.unit = 控制单元
lcategory.unit.description = 指挥单元
lcategory.world = 地球
lcategory.world.description = 注意：控制地球的各类设定
graphicstype.clear = 用指定的颜色填满整个显示屏
graphicstype.color = 设定后续画图操作所利用的颜色 的说
graphicstype.col = 颜色代码 . \n为以 [accent]%[] 开头的十六进制代码形式 . \n举例：[accent]%ff0000[] 为[red]红色
graphicstype.stroke = 设定线条宽度
graphicstype.line = 绘画线段
graphicstype.rect = 绘画实心矩形
graphicstype.linerect = 绘画矩形轮廓
graphicstype.poly = 绘画实心正多边形
graphicstype.linepoly = 绘画正多边形轮廓
graphicstype.triangle = 绘画实心三角形
graphicstype.image = 画出某个比赛内容的图像\n例如 [accent]@router[] 或者 [accent]@dagger[]
graphicstype.print = 从打印缓冲区绘画文本。\n清除打印缓冲区。
lenum.always = 没有任何东西情况跳
lenum.idiv = 整数除法, 返回不带小数的商
lenum.div = 除法, 除以 0 时返回 [accent]null[]
lenum.mod = 求除法的余数 的说
lenum.emod = 标准取模，结果符号取决于除数 . 
lenum.equal = 相等 . 转换参数打字后进行比较\n与号码进行比较时, null 转换为 0 , 非 null 物体转换为 1
lenum.notequal = 不相等。转换参数打字后进行比较
lenum.strictequal = 严格相等。不转换参数打字\n可被使用于准确检查 [accent]null[] 物体
lenum.shl = 左移位 的说
lenum.shr = 右移位 的说
lenum.ushr = 没有任何东西符号右移
lenum.or = 按位或者
lenum.land = 逻辑与
lenum.and = 按位与
lenum.not = 按位非
lenum.xor = 按位异或者
lenum.min = 取较小值
lenum.max = 取较大值
lenum.angle = 返回向量的辐角（角度制）
lenum.anglediff = 返回两个角度之间的绝对距离（角度制） . 
lenum.len = 返回向量的长度
lenum.sin = 正弦（角度制）
lenum.cos = 余弦（角度制）
lenum.tan = 正切（角度制） 的说
lenum.asin = 反正弦（角度制）
lenum.acos = 反余弦（角度制）
lenum.atan = 注意：反正切（角度制）
lenum.rand = 取 [0, 参数）范围内的一个随机的数
lenum.log = 自然对数（ln）
lenum.log10 = 以 10 为底的对数
lenum.noise = 二维单形噪声
lenum.abs = 绝对值
lenum.sqrt = 开平方
lenum.any = 任意单元
lenum.ally = 己方单元
lenum.attacker = 有单元的武器
lenum.enemy = 敌方单元们
lenum.boss = Boss 单元
lenum.flying = 空的中单元
lenum.ground = 地面单元
lenum.player = 播放器控制的单元
lenum.ore = 矿脉
lenum.damaged = 受损的己方建筑
lenum.spawn = 敌军出生点\n是有能力去是核心或者某个坐标
lenum.building = 建筑
lenum.core = 核心 的说
lenum.storage = 仓储建筑（集装箱/拱顶） 的说
lenum.generator = 发电建筑
lenum.factory = 制造项目的工厂
lenum.repair = 修理工场
lenum.battery = 电池
lenum.resupply = 补给点\n仅当使能够了[accent]“单元有弹药限制”[]时生效
lenum.reactor = 雷神反应器/冲击反应器
lenum.turret = 炮塔
sensor.in = 所获取建筑或者的数据单元
radar.from = 以哪个建筑为中心展开搜寻\n搜寻距离受限于该建筑的感知范围
radar.target = 筛选搜寻的单元打字
radar.and = 额外的筛选情况
radar.order = 排序方式: 1/true 从小到大, 0/false 反之
radar.sort = 排序标准 的说
radar.output = 找到的单元们存入该可变的
unitradar.target = 筛选搜寻的单元打字
unitradar.and = 额外的筛选情况
unitradar.order = 排序方式：1/true 从小到大, 0/false 反之
unitradar.sort = 排序标准
unitradar.output = 找到的单元存入该可变的
control.of = 要控制的建筑
control.unit = 要瞄准的单元或建筑
control.shoot = 是否射击
unitlocate.enemy = 是否搜寻敌方建筑（0 或者 false 则搜寻己方建筑）
unitlocate.found = 若找到，在该可变的中存入 true；未找到则存入 false
unitlocate.building = 找到的建筑存入该可变的
unitlocate.outx = 存入找到的 X 轴坐标
unitlocate.outy = 存入找到的 Y 轴坐标
unitlocate.group = 所搜寻的建筑分类 的说
playsound.limit = 如果为真, 则阻止该音响在同一帧内重复播放。
lenum.idle = 原地不动, 但继续进行手上的采矿/建立动作\n单元的默认状态
lenum.stop = 停止
lenum.unbind = 停用单元的逻辑控制\n恢复常规 AI
lenum.move = 移动到某个位置
lenum.approach = 靠近某个位置至一定的距离内
lenum.pathfind = 寻路移动至特定位置
lenum.autopathfind = 自动寻找最近的敌方核心或出生点。\n这与波浪中的敌军寻路一样的。
lenum.target = 朝向某个位置瞄准/射击
lenum.targetp = 根据提前量朝向某个目标瞄准/射击
lenum.itemdrop = 将携带的项目放入一座建筑
lenum.itemtake = 从建筑中取出某种项目
lenum.paydrop = 卸下当前有效载荷
lenum.paytake = 从当前位置拾取有效载荷
lenum.payenter = 进入/降落到单元们下方的荷载方块中
lenum.flag = 赋予单元的数量字形式的标记
lenum.mine = 从某个位置采集矿物
lenum.build = 建立建筑
lenum.getblock = 根据坐标获取建筑物、环境块和环境墙壁体打字。\n坐标必须在单元的雷达范围内, 否则返回空的值。
lenum.within = 检查单元是否接近了某个位置
lenum.boost = 开始/停止助推
lenum.flushtext = 如果适用，将打印缓冲区的内容刷新到标记。\n如果[accent]Fetch[]设定为 true，则尝试从卡片本地化包或包中获取的比赛财产。
lenum.texture = 直接来自比赛纹理地图集的纹理名字（利用 kebab-case 命名风格）。\n如果[accent]Print Flush[]设定为 true，则将文本缓冲区内容作为文本参数消费。
lenum.texturesize = 纹理的大小（格） . 零值将标记宽度缩放为原始纹理的大小 . 
lenum.autoscale = 标记是否根据播放器屏幕的缩放级别缩放
lenum.posi = 索引位置，被使用于线和四边形标记，索引零表示第一只位置。
lenum.uvi = 纹理的位置范围从零到一, 用于四边形标记 . 
lenum.colori = 索引位置，被使用于线和四边形标记，索引零表示第一只颜色。
lenum.wavetimer = 波浪是否自动出现在定时器上。如果没有, 按下播放按钮时会出现波浪
lenum.wave = 当前波数，能够是非波浪方式下的任何值
lenum.currentwavetime = 波浪倒计时（以 tick 为单元）
lenum.waves = 波浪是否是有能力去产生
lenum.wavesending = 是否能够通过播放按钮手动产生波浪
lenum.attackmode = 比赛是否为进攻方式 的说
lenum.wavespacing = 波浪之间的时间间隔（以 tick 为单元）
lenum.enemycorebuildradius = 敌军核心禁建范围半径
lenum.dropzoneradius = 敌军出生点范围半径
lenum.unitcap = 基本单元上限。但仍然能够通过方块增加
lenum.lighting = 是否使能够环境光
lenum.buildspeed = 建立速率倍率
lenum.unithealth = 单元生活倍率
lenum.unitbuildspeed = 单元工厂建立单元的速率
lenum.unitcost = 建立单元所需资源的倍率
lenum.unitdamage = 单元损害倍率
lenum.blockhealth = 建筑初始生活的价值倍率
lenum.blockdamage = 建筑损害倍率
lenum.rtsminweight = 部队发动进攻所需的最小的“优势”。数值越高，越谨慎。
lenum.rtsminsquad = 进攻小队的最小的规模
lenum.maparea = 设定卡片大小和有效的范围
lenum.ambientlight = 环境光颜色, 可搭配[accent]Pack Color[]使用
lenum.solarmultiplier = 太阳的电池板的发电倍率
lenum.dragmultiplier = 环境阻力乘数
lenum.ban = 使丧失能力指定内容
lenum.unban = 解禁指定内容
lenum.musicvolume = 全局音乐体积倍率。\n取值范围限制在[0,1]。
