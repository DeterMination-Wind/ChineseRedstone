onset.mine.mobile = 咔哒墙壁上的 :beryllium: [accent]贝里尔矿[]以手动开采。
onset.research = 打开 :tree: 技术树 . \n瑞瑟奇 :turbine-condenser: [accent]涡轮冷凝器[]，并放置在通风口上 . \n它能够产生[accent]帕瓦[] . 
onset.bore = 瑞瑟奇并放置 :plasma-bore: [accent]等离子钻机[]。\n它能够自动挖掘墙壁上的瑞索斯。 的说
onset.power = 为了给等离子钻机提供[accent]帕瓦[], 瑞瑟奇并放置一个 :beam-node: [accent]激光节点[] . \n它会连接涡轮冷凝器与等离子钻机 . 
onset.ducts = 瑞瑟奇而且放置 :duct: [accent]艾特姆管子[]将等离子钻机挖掘的矿物移至科尔。\n\n咔哒而且拖动以连续放置艾特姆管子。\n滚动[accent]耗子的轮子[]以转向。
onset.ducts.mobile = 瑞瑟奇的并放置 :duct: [accent]艾特姆管子[]将等离子钻机挖掘的矿物移至科尔。\n\n长的按压一秒钟, 然后拖动以连续放置艾特姆管子。
onset.moremine = 扩大挖掘规模 . \n放置更多的的等离子钻机, 并用激光节点与艾特姆的管道来使它们正常工作 . \n挖掘 200 贝里尔 . 
onset.graphite = 要比尔德更先进的的比尔多，需求 :graphite: [accent]铅笔芯[] . \n利用等离子钻机挖掘铅笔芯 . 
onset.research2 = 开始瑞瑟奇[accent]工厂[] . \n瑞瑟奇 :cliff-crusher: [accent]墙壁们粉化器[]和 :silicon-arc-furnace: [accent]拱形硅胶炉[] . 
onset.arcfurnace = 拱形硅胶炉需求 :sand: [accent]沙滩[]与 :graphite: [accent]铅笔芯[]以冶炼 :silicon: [accent]硅胶[]。\n它也需求[accent]帕瓦[]。
onset.crusher = 使用 :cliff-crusher: [accent]墙壁粉化器[]挖掘沙滩。 的说
onset.fabricator = 使用[accent]尤尼特[]探索马普, 进行国防, 发动进攻。\n瑞瑟奇并放置一只 :tank-fabricator: [accent]坦克制造厂[]。
onset.makeunit = 普罗杜斯尤尼特 . \n咔哒“?”以显示普罗杜斯尤尼特所需瑞索斯 . 
onset.turrets = 利用尤尼特国防很有效的，但合理利用[accent]图雷特[]是有能力去供给更好的国防力 . \n放置一个 :breach: [accent]撕裂[] . \n图雷特需求供给 :beryllium: [accent]阿莫[] . 
onset.turretammo = 给图雷特供给[accent]贝里尔[]。
onset.walls = [accent]墙壁[]能够防止比尔多受到达梅吉。\n在图雷特周围放置一些:beryllium-wall:[accent]贝里尔墙壁[]。 的说
onset.enemies = 敌军来袭, 准备国防 . 
onset.defenses = [accent]建立国防：[lightgray] {0}
onset.attack = 敌军基地十分地脆弱 . 发动反攻 . 
onset.cores = 您能够在[accent]科尔地块[]上比尔德新的科尔。\n新科尔的功能类似于前沿基地, 且与其他科尔共享瑞索斯拱顶。\n放置一个 :core-bastion: 科尔。
onset.detect = 敌军将在两分钟内发现您。\n设立国防，挖掘矿物，并比尔德的普罗杜斯设施。
onset.commandmode = 按住[accent]shift[]键进入[accent]指挥方式[]。\n按住[accent]耗子左边的按钮[]框选尤尼特。\n[accent]正确的按钮[]指挥所选尤尼特移动或者进攻。
onset.commandmode.mobile = 咔哒左下角的[accent]指挥[]进入[accent]指挥方式[] . \n按住屏幕, [accent]拖动[]框选尤尼特 . \n[accent]咔哒[]指挥所选尤尼特移动或进攻 . 
aegis.tungsten = 钨能够利用[accent]冲击钻[]进行开采。\n该结构需求[accent]水[]和[accent]帕瓦[]。
split.pickup = 科尔的尤尼特能够拾取一些布洛克。\n拾取这个[accent]强化的集装箱[]并将其放到[accent]有效载荷装货者[]中。\n（默认使用快的钥匙“[”拾取有效载荷，“]”放下载荷）
split.pickup.mobile = 科尔尤尼特能够拾取一些布洛克 . \n拾取这个[accent]强化的集装箱[]而且将其放到[accent]有效载荷装货者[]中 . \n（长的按压以拾取或者放下载荷）
split.acquire = 您需求获取钨来普罗杜斯尤尼特。
split.build = 尤尼特必须被运输到墙壁的另一侧。\n在墙壁两侧各放置一个[accent]有效载荷质量驱动器[]。\n咔哒其中一个, 然后咔哒另一个以连接它们。
split.container = 与强化的集装箱类似，尤尼特也能够使用[accent]有效载荷质量驱动器[]运输。\n在有效载荷质量驱动器旁放置尤尼特工厂以向其装载尤尼特，然后将尤尼特运输到墙壁的另一侧，摧毁敌方基地。
item.copper.description = 用于所有类型的建立和弹药。
item.copper.details = 警察。在塞普罗行星上异常丰富的金属。除非被加强,结构上是弱的。
item.lead.description = 用于液体的运输和电的结构们。
item.lead.details = 密集的。惰性的。广泛地用于电池们。\n注意：可能对生物的生活形式有毒,并不是说这里还剩下很多。
item.metaglass.description = 用于比尔德的输送或储存液体的的比尔多。
item.graphite.description = 用于制造电子元件, 或者作为图雷特阿莫。
item.sand.description = 用于普罗杜斯其他精炼材料 . 
item.coal.description = 用作燃料, 或用于精炼材料普罗杜斯。
item.coal.details = 似乎的是植物的化石，在孢子出现很久前就形成了。
item.titanium.description = 用于液体的输送比尔多,演习和工厂。
item.thorium.description = 用于耐用的结构们以及作为核的燃料。
item.scrap.description = 被使用于在熔炉和粉化器中精炼成其他材料 . 
item.scrap.details = 残骸比尔多的和残留物的尤尼特 . 
item.silicon.description = 用于太阳面板、复杂的电气元件或作为追踪性阿莫。
item.plastanium.description = 被利用于高级尤尼特、绝缘材料, 或作为分散性阿莫。
item.phase-fabric.description = 用于高级电子装置和自修复比尔多。
item.surge-alloy.description = 用于先进武器和反应国防比尔多。
item.spore-pod.description = 用于转化成石油,爆炸化合物或作为燃料。
item.spore-pod.details = 孢子。可能是人工合成的生活形式，释放对其他生物有毒的气体，极具侵略性。在某些情况下高度易燃。
item.blast-compound.description = 用作炸弹或爆炸性阿莫。
item.pyratite.description = 用于烧焦发射类武器和使用燃料的发电装置。
item.beryllium.description = 被利用于埃里克尔的多种比尔多的和阿莫。
item.tungsten.description = 用于演习、装甲和阿莫。用于比尔德更先进的比尔多。
item.oxide.description = 用作热导体和绝缘体。的
item.carbide.description = 用于先进的比尔多、重型尤尼特和阿莫。
liquid.water.description = 被使用于冷却机器和废物处理。
liquid.slag.description = 在分离器中提炼成金属成分，或作为武器阿莫喷朝向敌军。
liquid.oil.description = 用于先进材料普罗杜斯和喷射类武器。
liquid.cryofluid.description = 用作反应器、图雷特的和工厂的冷却剂。
liquid.arkycite.description = 被使用于发电和合成材料的化学反应。
liquid.ozone.description = 用作材料普罗杜斯的氧化剂和燃料。有一定爆炸性。 的说
liquid.hydrogen.description = 被利用于瑞索斯的开采、尤尼特普罗杜斯和结构修复 . 易燃 . 
liquid.cyanogen.description = 用于构建先进的比尔多的和尤尼特, 也用作阿莫。高度易燃。
liquid.nitrogen.description = 用于瑞索斯的开采、气体普罗杜斯和尤尼特普罗杜斯 . 
liquid.neoplasm.description = 瘤变反应器产出的危险的生物性副产物。会很快扩散至它能接触到的含水布洛克的而且破坏它们。有粘性。
liquid.neoplasm.details = 肿瘤液。由一种不能够控制并快速分散的合成细胞团组成, 具有污泥状的粘稠度。耐热。对任何含有水的结构极为危险的。\n\n从标准分析来看过于复杂和不稳定的, 潜在的应用不知道的。推荐在矿渣池中焚毁。
block.derelict = 注意：\uf77e [lightgray]废墟
block.armored-conveyor.description = 朝向前运输艾特姆, 不接受侧面进口, 除非来自其他输送者。
block.illuminator.description = 供给照明。
block.message.description = 拯救文字情报，用于队友间进行交流 . 
block.reinforced-message.description = 拯救文字情报, 用于队友间进行交流。
block.world-message.description = 一只用于制图的消息板 . 不能够被摧毁 . 
block.world-processor.description = 一个用于制图的普罗塞瑟。不可以够被摧毁。可使用特殊命令, 如产生尤尼特或改变地块。 的说
block.world-cell.description = 一只用于制图的梅莫里元 . 不是有能力去被摧毁 . 
block.world-switch.description = 一只用于制图的交换机 . 不可以够被摧毁 . 只能与同队普雷尔交互 . 
block.shield-projector.description = 一个用于制图的希尔德投影仪 . 不能够被摧毁 . 
block.large-shield-projector.description = 一个被使用于制图的希尔德投影仪。不能够被摧毁。
block.graphite-press.description = 将煤炭压缩为铅笔芯。
block.multi-press.description = 将煤炭压缩为铅笔芯，需求水进行冷却。
block.silicon-smelter.description = 将沙滩和煤炭精炼为硅胶。
block.kiln.description = 将沙滩和领导熔炼为金属玻璃 . 
block.plastanium-compressor.description = 用石油和泰坦普罗杜斯塑料钛 . 
block.phase-weaver.description = 用雷神和沙滩合成阶段布。
block.surge-smelter.description = 将泰坦、领导、硅胶和警察熔炼成激增合金。
block.cryofluid-mixer.description = 将水和细泰坦粉混合制成低温液。
block.blast-mixer.description = 利用火石和孢子豆荚普罗杜斯爆炸化合物。
block.pyratite-mixer.description = 把煤炭、领导和沙滩混合成火石。
block.melter.description = 将吵架正在融化成矿渣液。
block.separator.description = 将矿渣液分离成矿物成分。的
block.spore-press.description = 将孢子豆荚压缩成石油。
block.pulverizer.description = 将吵架粉碎成细沙滩 . 
block.coal-centrifuge.description = 把石的油变成煤炭。
block.incinerator.description = 熔融而且蒸发它接收到的任何艾特姆或液体的。
block.power-void.description = 消费进口的所有的帕瓦，仅限沙滩盒。
block.power-source.description = 没有限制出口帕瓦，仅限沙滩盒。
block.item-source.description = 没有限制出口艾特姆, 仅限沙滩盒 . 
block.item-void.description = 销毁进口的所有的艾特姆，仅限沙滩盒 . 
block.liquid-source.description = 没有限制出口液体的，仅限沙滩盒。
block.liquid-void.description = 蒸发进口的所有的液体的, 仅限沙滩盒。
block.payload-source.description = 没有限制出口有效载荷，仅限沙滩盒。
block.payload-void.description = 销毁进口的所有有效载荷，仅限沙滩盒 . 
block.copper-wall.description = 被保护己方比尔多，挡下敌方炮弹。
block.copper-wall-large.description = 被保护己方比尔多, 挡下敌方炮弹。
block.titanium-wall.description = 被保护己方比尔多，挡下敌方炮弹。
block.titanium-wall-large.description = 被保护己方比尔多，挡下敌方炮弹 . 
block.plastanium-wall.description = 被保护己方比尔多，挡下敌方炮弹 . 能吸收激光和拱形，但也会阻止帕瓦节点自动地连接 . 
block.plastanium-wall-large.description = 被保护己方比尔多, 挡下敌方炮弹。能吸收激光和拱形, 但也会阻止帕瓦的节点自动连接。
block.thorium-wall.description = 被保护己方比尔多, 挡下敌方炮弹。
block.thorium-wall-large.description = 被保护己方比尔多, 挡下敌方炮弹。
block.phase-wall.description = 被保护己方比尔多，挡下敌方炮弹。受大多数子弹进攻的时有概率将其反弹。
block.phase-wall-large.description = 被保护己方比尔多, 挡下敌方炮弹 . 受大多数子弹进攻时有概率将其反弹 . 
block.surge-wall.description = 被保护己方比尔多，挡下敌方炮弹。受进攻的时间断释放拱形。
block.surge-wall-large.description = 被保护己方比尔多，挡下敌方炮弹。受进攻时间断释放拱形。
block.scrap-wall.description = 被保护己方比尔多, 挡下敌方炮弹。
block.scrap-wall-large.description = 被保护己方比尔多, 挡下敌方炮弹。
block.scrap-wall-huge.description = 被保护己方比尔多，挡下敌方炮弹。
block.scrap-wall-gigantic.description = 被保护己方比尔多, 挡下敌方炮弹。
block.door.description = 是有能力去交换机的墙壁。
block.door-large.description = 能够交换机的墙壁 . 
block.mender.description = 定期修复附近的比尔多。\n可使用硅胶提高雷达斯的和效率。
block.mend-projector.description = 定期修复附近的比尔多。\n可利用阶段布提高雷达斯的和效率。
block.overdrive-projector.description = 提升附近比尔多的的工作效率。\n可使用阶段布提高雷达斯和效率。
block.force-projector.description = 在自身周围建立一个六边形力场, 使得里面的比尔多的和尤尼特免受达梅吉。\n承受过多达梅吉会导致过热, 能够使用冷却液降温。阶段布可被使用于增加力场大和小。
block.shock-mine.description = 对踩到它的敌军释放拱形进行进攻。
block.conveyor.description = 向前方运输艾特姆们。
block.titanium-conveyor.description = 向前运输艾特姆，比初级输送者更快。
block.plastanium-conveyor.description = 打包艾特姆进行运输。\n从后方进口艾特姆，三个方向出口艾特姆。需求多个装载和卸载点才能达到最大的吞吐量。
block.junction.description = 两条交叉输送者的桥梁。
block.bridge-conveyor.description = 跨越任意地形或比尔多的运输艾特姆 . 
block.phase-conveyor.description = 跨越任意地形或比尔多的即时运输艾特姆。比输送者桥雷达斯更大，但需求帕瓦。
block.sorter.description = 如果艾特姆与所选种类一样的, 则允许其通过。否则, 艾特姆将向两侧出口。
block.inverted-sorter.description = 像分类者一样处理艾特姆，不过是向两侧出口所选的艾特姆。
block.router.description = 把输入的艾特姆们平均地分配到其他 3 个方向们。
block.router.details = 这是个必要之恶。不建议在生产输入旁边使用它们,因为它们将会被输出堵塞。
block.distributor.description = 将艾特姆的平均分配到其他 7 只方向。
block.overflow-gate.description = 当前方被阻塞时才会朝向两侧出口，被利用于处理多余的艾特姆。
block.underflow-gate.description = 与溢出的大门相反，当两侧均堵塞时才朝向前运输。
block.mass-driver.description = 长距离的艾特姆运输结构。收集批量的艾特姆们并把它们射击到其他的群众驱动器们。
block.mechanical-pump.description = 抽水器送液体的, 不需求帕瓦。
block.rotary-pump.description = 抽水器送液体的，需求帕瓦。
block.impulse-pump.description = 抽水器送液体的。
block.conduit.description = 朝向前传输液体的。与抽水器或者其他管道联合使用。
block.pulse-conduit.description = 朝向前传输液体的。比普通管道传输液体的更快, 且能储存更多的液体的。
block.plated-conduit.description = 向前传输液体的, 不接受侧面进口 . 不会发生泄漏 . 
block.liquid-router.description = 接受一个方向的液体的进口，而且平均出口到其他 3 只方向。能够储存一定量的液体的。
block.liquid-container.description = 储存数量可观的液体的，而且像液体的路由器一样朝各个方向出口液体的。
block.liquid-tank.description = 储存大量的液体的，并像液体的路由器一样朝各个方向出口液体的 . 
block.liquid-junction.description = 两条交叉管道的桥梁。
block.bridge-conduit.description = 跨越任意地形或比尔多的物传输液体的 . 
block.phase-conduit.description = 跨越任意地形或者比尔多的物传输液体的。比管道桥雷达斯更大, 但需求帕瓦。
block.power-node.description = 向连接的其他节点传输帕瓦，也能从相邻的比尔多接收帕瓦或向其供电。
block.power-node-large.description = 连接雷达斯的更大的高级帕瓦的节点。
block.surge-tower.description = 被使用于远距离连接的帕瓦节点, 但连接数较少。
block.diode.description = 单向传输帕瓦, 仅当该方向上帕瓦储备较少时起作用。
block.battery.description = 储存电网多余帕瓦，并在电网供电不够时放电 . 
block.battery-large.description = 储存电网多余帕瓦，而且在电网供电不够时放电 . 比正常的电池容量更高 . 
block.combustion-generator.description = 正在燃烧煤炭之类的可燃材料发电。
block.thermal-generator.description = 被放置在炽热的地形上能够发电。
block.steam-generator.description = 通过正在燃烧易燃材料而且将水转化为蒸汽发电。
block.differential-generator.description = 利用低温流体与正在燃烧的火石之间的温差产生大量帕瓦 . 
block.rtg-generator.description = 利用放射物衰变产生的热慢的地产生帕瓦。
block.solar-panel.description = 利用太阳的产生少量帕瓦。
block.solar-panel-large.description = 利用太阳的制造出少量帕瓦，比标准太阳的电池板更高效。
block.thorium-reactor.description = 从放射性的雷神中制造出大量的帕瓦，需求持续冷却。如果冷却液供应不够，会剧烈爆炸。
block.impact-reactor.description = 达到最高效率时能产生巨量帕瓦，但启动时也需求进口大量帕瓦 . 
block.mechanical-drill.description = 放置在矿物上时，以慢的斯皮德没有限制出口艾特姆 . 只能开采基本瑞索斯 . 
block.pneumatic-drill.description = 一种改进的演习，能开采泰坦。采矿斯皮德比机械演习快。
