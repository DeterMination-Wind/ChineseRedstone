unit.crawler.description = 冲向敌军而且自毁, 造成大雷达斯的爆炸。
unit.atrax.description = 向地面塔吉特发射削弱性的球状矿渣液。能够跨越大多数地形。
unit.spiroct.description = 向敌军发射被削弱性的激光束，并在该过程中自我修复。能够跨越大多数地形。
unit.arkyid.description = 朝向敌军发射大型激光束，而且在该过程中自我修复。能够跨越大多数地形。
unit.toxopid.description = 向敌军发射大的带电集束炮弹和穿透性激光。能够跨越大多数地形。
unit.flare.description = 向敌军发射标准子弹。
unit.horizon.description = 向正下方的地面敌军投掷炸弹。
unit.zenith.description = 向敌军发射多枚导弹 . 
unit.antumbra.description = 向敌军发射密集的子弹 . 
unit.eclipse.description = 向敌军发射穿透性激光和爆炸性炮弹。
unit.mono.description = 自动地开采警察和领导,并把它们存放进科尔里。
unit.poly.description = 自动重建被摧毁的比尔多，并协助其他尤尼特进行比尔德。
unit.mega.description = 自动修复受损比尔多 . 是有能力去携带比尔多和小型地面尤尼特 . 
unit.quad.description = 向地面塔吉特投掷等离子炸弹, 修复己方比尔多并摧毁敌军。是有能力去携带中型地面尤尼特。
unit.oct.description = 用它再生的盾牌保护附近的盟友。能够携带大多数的地面尤尼特们。
unit.risso.description = 向敌军发射一串导弹与子弹 . 
unit.minke.description = 注意：朝向敌军发射炮弹和标准子弹。
unit.bryde.description = 朝向敌军发射远程炮弹和导弹。
unit.sei.description = 向敌军发射一串导弹与穿甲弹 . 
unit.omura.description = 向敌军发射远程穿透轨道炮。
unit.alpha.description = 被保护初代科尔, 可比尔德的比尔多。
unit.beta.description = 被保护次代科尔,可比尔德比尔多。
unit.gamma.description = 被保护终代科尔，可比尔德的比尔多。
unit.retusa.description = 向敌军发射追踪鱼雷，并修复己方尤尼特。
unit.oxynoe.description = 向敌军发射烧焦束, 而且修复己方比尔多。搭载一台单点国防图雷特, 能够国防来袭的子弹。
unit.cyerce.description = 向敌军发射追踪集束导弹，并修复己方尤尼特。
unit.aegires.description = 制造出能源场，使得雷达斯的内的敌方比尔多与尤尼特受到震惊，对己方则进行修复。
unit.navanax.description = 发射大的电磁爆弹, 对敌方电网造成重大破坏, 同时可修复友军比尔多, 压制敌方修复比尔多 . 搭载4台自动激光炮台, 能正在融化靠近的敌军 . 
unit.stell.description = 向敌军发射普通子弹 . 
unit.locus.description = 朝向敌军交替发射子弹 . 
unit.precept.description = 向敌军发射穿透性集束子弹。
unit.vanquish.description = 朝向敌军发射大型穿透性分散子弹 . 
unit.conquer.description = 朝向敌军发射大量大的穿透性子弹。
unit.merui.description = 向地面敌军发射远程火炮。能够跨越大多数地形。
unit.cleroi.description = 向敌军发射双发炮弹。搭载一台单点国防图雷特，是有能力去国防来袭的子弹。是有能力去跨越大多数地形。
unit.anthicus.description = 向敌军发射远程追踪导弹 . 是有能力去跨越大多数地形 . 
unit.tecta.description = 向敌军发射等离子追踪导弹。用它前方的希尔德的被保护自己。能够跨越大多数地形。
unit.collaris.description = 向敌军发射远程分散火炮。能够跨越大多数地形。
unit.elude.description = 向敌军发射螺旋状追踪子弹 . 能够在液体的上悬浮 . 
unit.avert.description = 朝向敌军发射螺旋状扭曲子弹。
unit.obviate.description = 朝向敌军发射螺旋状闪电球 . 
unit.quell.description = 向敌军发射远程追踪导弹。能够压制敌方修复比尔多。
unit.disrupt.description = 朝向敌军发射远程压制性追踪导弹。能够压制敌方修复比尔多。
unit.evoke.description = 被保护城堡科尔, 可比尔德的比尔多。使用激光束修复比尔多。
unit.incite.description = 被保护堡垒科尔，可比尔德比尔多。利用激光束修复比尔多。
unit.emanate.description = 被保护卫城科尔，可比尔德的比尔多 . 使用一对激光束修复比尔多 . 
lst.read = 从连接的梅莫里读号码。
lst.write = 朝向连接的梅莫里写号码。
lst.print = 添加文字到打印缓存\n利用 [accent]Print Flush[] 后才会真正显示。
lst.printchar = 向打印缓存添加一个 UTF-16 字符或者内容图标。\n直到利用 [accent]Print Flush[] 后才会真正显示出。
lst.format = 用一只值替换文本缓冲区中的下一只占位符。\n如果占位符方式无效的，则不会执行任何的操作。\n占位方式："{[accent]number 0-9[]}"\n示例：\n[accent]print "test {0}"\n格式 “示例”。
lst.draw = 添加绘图操作到绘图缓存\n使用 [accent]Draw Flush[] 后才会真正显示出。
lst.drawflush = 将绘图缓存中的 [accent]Draw[] 队列刷新到显示出屏 . 
lst.printflush = 将打印缓存中的 [accent]Print[] 队列刷新到消息板。
lst.getlink = 获取与普罗塞瑟连接的比尔多\n比尔多编号从 0 开始。
lst.control = 控制比尔多。
lst.radar = 让比尔多的搜寻感知雷达斯的内的尤尼特 . 
lst.sensor = 从比尔多的或者尤尼特的中获取达塔。
lst.set = 给可变的赋值 . 
lst.operation = 对 1 到 2 个可变的执行操作。
lst.select = 根据情况在两个值中选择一只赋给可变的。
lst.end = 跳至第一条命令。
lst.wait = 等待指定的秒钟数 . 
lst.stop = 停止该普罗塞瑟的运行。
lst.lookup = 根据 ID 查阅一种艾特姆/液体的/尤尼特/比尔多\n各个分类中的工程总数量是\n[accent]@unitCount[] / [accent]@itemCount[] / [accent]@liquidCount[] / [accent]@blockCount[]。
lst.jump = 根据情况判断，决定是否跳至另一条命令。
lst.unitbind = 绑定某个打字的下一个尤尼特, 或直接绑定指定的尤尼特\n而且拯救至 [accent]@unit[]。
lst.unitcontrol = 控制已绑定的尤尼特 . 
lst.unitradar = 让绑定的尤尼特的搜寻感知雷达斯内的其他尤尼特。
lst.unitlocate = 让绑定的尤尼特搜寻整个马普中特定的比尔多或位置 . 
lst.getblock = 获取任意位置的地块达塔。
lst.setblock = 塞廷斯任意位置的地块达塔 . 
lst.spawnunit = 在指定位置产生尤尼特。
lst.spawnbullet = 在指定位置产生子弹。
lst.applystatus = 添加或清除尤尼特的的一个斯塔图斯的效果。 的说
lst.weathersense = 检查特定种类的气候当前是否使能够 . 
lst.weatherset = 塞廷斯当前斯塔图斯的为特定打字气候 . 
lst.spawnwave = 在任意位置产生一波敌军\n并不记录在波数计数器中。
lst.explosion = 在某个位置产生爆炸。
lst.setrate = 在命令/时间的刻的时间下塞廷斯普罗塞瑟处理斯皮德。
lst.fetch = 按索引查找尤尼特、科尔、普雷尔或比尔丁\n索引从 0 开始, 以其返回的计数结束。
lst.packcolor = 将 RGBA 各分量（0-1 雷达斯）打包为单个整数，用于绘图或罗吉克规则 . 
lst.unpackcolor = 从使用[accent]Pack Color[]打包的颜色值中解压 RGBA 组件。的
lst.setrule = 塞廷斯马普的规则。
lst.flushmessage = 在屏幕中央投影仪文字缓存区的内容\n会等待上一个文字显示出结束。
lst.cutscene = 控制普雷尔比赛视角。
lst.setflag = 塞廷斯一个能够被所有的普罗塞瑟读的全局 flag。 的说
lst.getflag = 检查是否塞廷斯了全局 flag . 
lst.setprop = 塞廷斯尤尼特的或者比尔多的物的财产 . 
lst.effect = 建立一只粒子效果。
lst.sync = 在网络中同步一个可变的 . \n每一个可变的每秒钟最多同步 20 次 . 
lst.playsound = 播放音响。\n沃鲁姆和声场位置能够是全局值，也能够根据位置计算得出。
lst.playmusic = 按名字播放音乐，如[accent]"game1"[].\n如果[accent]interrupt[]塞廷斯为 true ，先前播放的音乐将会中止\n播放 null 而且把 interrupt 塞廷斯为 true 能够停止音乐。\n通知，达塔的补丁中的音乐需加上[accent]dp-[]前缀。
lst.makemarker = 在地球中建立一个新的罗吉克标记。\n必须提供一个用于标识该标记的 ID。\n目前每一个地球限制最多 20000 个标记。
lst.setmarker = 为标记塞廷斯财产。\n使用的 ID 必须与制作标记命令中的一样的。
lst.localeprint = 将马普的本地化文本财产值添加到文本缓冲区中。\n要在马普编辑者中塞廷斯马普本地化包, 请检查 [accent]马普情报 > 本地化包[]。\n如果客户是移动装置, 则尝试首先打印以 “.mobile” 结尾的财产。
lst.query = 在特定区域查询尤尼特的或比尔多。\n结果出口在[accent]@queries[]中\n能够在[accent]Read[]命令中利用编号从[accent]@queries[]中读结果\n[accent]@queries[]的长度能够用[accent]@size[]作为参数获得。
lglobal.false = 0 的说
lglobal.true = 1 的说
lglobal.null = null 的说
lglobal.@pi = 数学的常数 pi (3.141…)
lglobal.@e = 数学常数 e (2.718…)的
lglobal.@degToRad = 将角度制转换为弧度制 的说
lglobal.@radToDeg = 将弧度制转换为角度制的
lglobal.@time = 当前保存文件的的比赛时间, 以毫秒钟为尤尼特
lglobal.@tick = 当前保存文件的的比赛时间, 以 tick 为尤尼特（每秒钟 60 个 ticks）
lglobal.@second = 当前保存文件的的比赛时间，以秒钟为尤尼特
lglobal.@minute = 当前保存文件的的比赛时间，以分钟为尤尼特
lglobal.@waveNumber = 当前波数（如果波浪的已使能够）
lglobal.@waveTime = 波浪的的倒计时定时器, 以秒钟为尤尼特
lglobal.@mapw = 马普宽度（尤尼特：格）
lglobal.@maph = 马普的高度（尤尼特：格）
lglobal.sectionMap = 马普
lglobal.sectionGeneral = 通用们
lglobal.sectionNetwork = 网络/客户 [仅限地球普罗塞瑟]
lglobal.sectionProcessor = 普罗塞瑟
lglobal.sectionLookup = 查找的
lglobal.@this = 执行代码的罗吉克块
lglobal.@thisx = 执行代码的罗吉克块的 X 坐标
lglobal.@thisy = 执行代码的罗吉克块的 Y 坐标
lglobal.@links = 连接到该普罗塞瑟的总块数
lglobal.@ipt = 普罗塞瑟的执行斯皮德，以每个 tick 的命令数为尤尼特（每秒钟 60 个 ticks）
lglobal.@unitCount = 比赛中尤尼特内容的打字总数量；与查找命令一起利用
lglobal.@blockCount = 比赛中块内容的打字总数量；与查找命令一起使用
lglobal.@itemCount = 比赛中艾特姆内容的打字总数量；与查找命令一起使用
lglobal.@liquidCount = 比赛中液体的内容的打字总数量；与查找命令一起使用
lglobal.@server = 如果代码正在瑟弗上运行或者单人比赛中运行，则为 true，否则为 false
lglobal.@client = 如果代码正在连接到瑟弗的客户上运行，则为 true
lglobal.@clientLocale = 运行代码的客户的区域塞廷斯。例如：en_US
lglobal.@clientUnit = 运行代码的客户的尤尼特
lglobal.@clientName = 运行代码的客户的普雷尔名字
lglobal.@clientTeam = 运行代码的客户的队伍 ID
lglobal.@clientMobile = 如果运行代码的客户是移动端，则为 true，否则为 false
lglobal.@clientMusicPlaying = 如果当前正在播放任何的音乐，则为True
lglobal.@clientCurrentMusic = 正在播放的当前音乐的名字，或为null
lenum.type = 比尔多和尤尼特的打字，返回一个“打字”而非绳子\n例如对路由器利用，会返回[accent]@router[]
lenum.shoot = 朝向某个位置瞄准/射击
lenum.shootp = 根据提前量朝向某个尤尼特或比尔多瞄准/射击
lenum.config = 比尔多的塞廷斯，例如分类者所塞廷斯的筛选艾特姆种类
lenum.enabled = 比尔多的是否已使能够
