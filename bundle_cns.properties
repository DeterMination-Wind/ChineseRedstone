block.water-extractor.description = 从地下提取水, 适被使用于附近没有地表水的情况。
block.cultivator.description = 将大气中低浓度的孢子培养成孢子豆荚。
block.cultivator.details = 一种失传已久的技术, 被使用于尽可能高效地普罗杜斯大量生物质。现在覆盖了塞普罗的孢子, 最初的培养装置可能就是它。
