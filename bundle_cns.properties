block.thorium-wall.description = 被保护己方建筑, 挡下敌方炮弹 . 
block.thorium-wall-large.description = 被保护己方建筑, 挡下敌方炮弹 . 
block.phase-wall.description = 被保护己方建筑，挡下敌方炮弹。受大多数子弹进攻时有概率将其反弹。
block.phase-wall-large.description = 被保护己方建筑，挡下敌方炮弹 . 受大多数子弹进攻时有概率将其反弹 . 
block.surge-wall.description = 被保护己方建筑，挡下敌方炮弹。受进攻时间断释放拱形。
block.surge-wall-large.description = 被保护己方建筑，挡下敌方炮弹。受进攻时间断释放拱形。
block.scrap-wall.description = 被保护己方建筑, 挡下敌方炮弹 . 
