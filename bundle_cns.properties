sector.groundZero.description = 这是最佳起点 . 敌军威胁较低, 资源稀少 . \n尽量收集领导和警察 . \n然后继续前进 . 
sector.frozenForest.description = 即便在接近山区的地方, 孢子依然蔓延。严寒的气温不是有能力去永远遏制它们。\n\n开始探索功率。建立火力生成器。学习使用修补者。
sector.saltFlats.description = 沙滩漠边缘是盐碱荒滩，资源稀少 . \n\n敌军已在此建立了资源存储区 . 摧毁他们的核心，片甲不留 . 
sector.crateredBattleground.description = 这片由旧时战争的遗迹造成的陨石地带有积水 . \n\n夺下该扇区, 收集沙滩冶炼玻璃 . \n用水抽水器抽水加速炮塔和演习 . 
sector.ruinousShores.description = 穿过荒地就是海滩。\n这里曾经有一条海岸防线，但现在已所剩没有任何东西几。\n一些基本的的国防建筑还完好没有任何东西损，除此之外都变成了废墟。\n\n继续朝向外扩张并研究技术。
sector.stainedMountains.description = 深入内陆地区便是山脉，这里目前还未被孢子污染。\n敌军势力更加强大，别给他们的精锐部队留下喘息之机。\n\n这一地区分布着丰富的泰坦，试着开采并利用它。
sector.overgrowth.description = 这里的孢子靠近它最初的发源地, 因此得以疯狂生长。\n\n敌军在该处建立了一个前哨站, 建立匕首单元来摧毁它。
sector.tarFields.description = 产油区边缘，位于山脉和沙滩漠之间 . 它是为数不多蕴藏了石油的地区之一 . \n尽管这里一片废墟，附近仍有一些危险的的敌方单元 . 不要低估他们 . \n\n[lightgray]尽你所能研究石油加工技术 . 
sector.desolateRift.description = 非常地危险的的扇区, 资源丰富但空的间狭窄, 敌军也十分危险的 . \n\n尽快发展与国防, 不要因进攻间隔的敌军太长而掉以轻心 . 
sector.nuclearComplex.description = 曾用来制造加工雷神的设施, 如今已变成了废墟。\n这里有大量的敌军, 不断搜寻着入侵者。\n\n[lightgray]研究雷神以及它的各种用途。
sector.fungalPass.description = 一边是高山, 另一边是孢子丛生的平原。\n这里有一个敌方的小的侦察基地, 摧毁它。\n\n使用匕首和爬行者单元, 摧毁敌方核心。
sector.biomassFacility.description = 孢子的起源, 有研究和制造孢子的原始设施。\n\n[lightgray]在这个设施毁灭后, 孢子被释放, 原生生态系统完全不能够抵挡这种外来物种。\n研究其中的技术, 培养孢子, 被利用于燃料和塑料的制造。 的说
sector.windsweptIslands.description = 海岸线之外坐落着这一串群岛。据记载这里曾有制造[accent]塑料钛[]的建筑。\n\n抵御敌军的海军，在岛上建立基地，研究制造建筑。
sector.extractionOutpost.description = 一座遥远的前哨, 敌军建立它朝向其他扇区发射资源。\n\n跨区运输技术对于进一步征服至关重要的。摧毁这个的基地, 研究发射垫。
sector.impact0078.description = 注意：最初进入这个星系的星际运输船的残骸留在了这里。\n\n尽量从残骸中回收有用的物资，而且研究技术。
sector.planetaryTerminal.description = 最终目标。\n\n这个海岸基地有一个能将核心发射到其它设施的行星，防守非常地严密。\n\n制造海军单元，尽快消灭敌军，研究发射建筑。
sector.coastline.description = 在这个地点发现了海军单元技术的遗迹。击退敌军的进攻，夺取这个区域，而且研究技术。
sector.navalFortress.description = 敌军在一个偏远且自然岛屿上建的国防立了基地。摧毁这个前哨，获得先进的海军技术并进行研究。
sector.facility32m.description = 这个扇区们中坐落着一所炸药制造设施的破败遗迹 . \n\n占领这个区域 . 研究炸药混合器 . 制造爆炸化合物作为炮塔弹药 . 
sector.taintedWoods.description = [gray][可选目标][]\n这个扇区石油储备丰富，有大面积的真菌繁殖，难以穿越。\n\n利用它的资源制造塑料钛。避开敌军。
sector.sunkenPier.description = [gray][可选目标][]\n这里曾经是海上油井, 已经年久失修。\n\n侦察到大量海军单元们。准备好应对多方朝向的敌军袭击。
sector.atolls.description = [gray][可选目标][]此地侦察到大量敌军海军基地。\n\n使用兆将地面单元运送到进攻位置。建立海军单元来摧毁外围前哨。
sector.frontier.description = 在此处侦察到一个小的敌军前哨。\n\n建立单声道来更高效地获取资源们。利用数增级单元重构工厂来构建更强大的单元。
sector.infestedCanyons.description = 群山之外坐落着一条蜿蜒的河谷, 现在却覆盖着孢子苔藓 . \n\n在敌军的进攻中把守好陆地 . 建立海军单元, 消灭所有敌方核心 . 
sector.testingGrounds.description = [gray][可选目标][]\n布满陨石坑的沙滩谷，先前曾是军事工程的试验场\n\n由于缺水，在此处建立根据地会有困难 . 准备好应对多方向的敌军袭击 . 
sector.perilousHarbor.description = 在这版危险的的滨海地区建立了许多敌方基地。\n\n建立海军单元, 摧毁他们的堡垒。
sector.weatheredChannels.description = [gray][可选目标][]\n这片海峡蕴含着丰富的资源 . 着陆核心，驱赶敌军来占有资源 . \n\n敌军会从多个路线摧毁您的设施 . 当心伏击，并根据形势进行防守 . 
sector.mycelialBastion.description = 这个的堡垒群地处真菌地带的深处，用高级爬行类单元威胁着邻近扇区\n\n袭击此堡垒群，获得其中的技术，充分利用能够跨越墙壁的单元。
sector.littoralShipyard.description = 坐落在海洋中心的远处，这所海军制造设施有着建立先进的单元的技术。\n\n摧毁设施，使用其中的技术来救命完成最终目标。
