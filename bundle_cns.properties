sector.groundZero.description = 这是最佳起点 . 敌军威胁较低, 瑞索斯的稀少 . \n尽量收集领导和警察 . \n然后继续前进 . 
sector.frozenForest.description = 即便在接近山区的地方，孢子依然蔓延。严寒的气温不是有能力去永远遏制它们。\n\n开始探索帕瓦。比尔德的火力生成器。学习使用修补者。
sector.saltFlats.description = 沙滩漠边缘是盐碱荒滩, 瑞索斯的稀少。\n\n敌军已在此建立了瑞索斯存储区。摧毁他们的科尔, 片甲不留。
sector.crateredBattleground.description = 这片由旧时战争的遗迹造成的陨石地带有积水。\n\n夺下该扇区, 收集沙滩冶炼玻璃。\n用水抽水器抽水加速图雷特的和演习。
sector.ruinousShores.description = 穿过荒地就是海滩 . \n这里曾经有一条海岸防线，但现在已所剩没有任何东西几 . \n一些基本的的国防的比尔多还完好没有任何东西损，除此之外都变成了废墟 . \n\n继续朝向外扩张并瑞瑟奇泰克 . 
sector.stainedMountains.description = 深入内陆地区便是山脉，这里目前还未被孢子污染。\n敌军势力更加强大，别给他们的精锐部队留下喘息之机。\n\n这一地区分布着丰富的泰坦，试着开采并利用它。
sector.overgrowth.description = 这里的孢子靠近它最初的发源地，因此得以疯狂生长。\n\n敌军在该处建立了一只前哨站，比尔德匕首尤尼特来摧毁它。
sector.tarFields.description = 产油区边缘, 位于山脉和沙滩漠之间。它是为数不多蕴藏了石油的地区之一。\n尽管这里一片废墟, 附近仍有一些危险的的敌方尤尼特。不要低估他们。\n\n[lightgray]尽你所能瑞瑟奇的石油加工技术。
sector.desolateRift.description = 非常地危险的的扇区, 瑞索斯丰富但空的间狭窄, 敌军也十分危险的 . \n\n尽快发展与国防, 不要因进攻间隔的敌军太长而掉以轻心 . 
sector.nuclearComplex.description = 曾用来普罗杜斯加工雷神的设施，如今已变成了废墟。\n这里有大量的敌军，不断搜寻着入侵者。\n\n[lightgray]瑞瑟奇的雷神以及它的各种使用目的。
sector.fungalPass.description = 一边是高山，另一边是孢子丛生的平原。\n这里有一只敌方的小的侦察基地，摧毁它。\n\n使用匕首和爬行者尤尼特，摧毁敌方科尔。
sector.biomassFacility.description = 孢子的起源，有瑞瑟奇和普罗杜斯孢子的原始设施。\n\n[lightgray]在这个设施毁灭后，孢子被释放，原生生态系统完全不能够抵挡这种外来物种。\n瑞瑟奇其中的技术，培养孢子，被利用于燃料和塑料的普罗杜斯。
sector.windsweptIslands.description = 海岸线之外坐落着这一串群岛 . 据记载这里曾有普罗杜斯[accent]塑料钛[]的比尔多 . \n\n抵御敌军的海军，在岛上建立基地，瑞瑟奇的普罗杜斯比尔多 . 
sector.extractionOutpost.description = 一座遥远的前哨，敌军比尔德它朝向其他扇区们发射瑞索斯。\n\n跨区运输技术对于进一步征服至关重要的。摧毁这个的基地，瑞瑟奇发射垫。
sector.impact0078.description = 最初进入这个星系的星际运输船的残骸留在了这里。\n\n尽量从残骸中回收有用的物资，而且瑞瑟奇泰克。 的说
sector.planetaryTerminal.description = 最终塔吉特 . \n\n这个海岸基地有一个能将科尔的发射到其它设施的普拉尼特，防守非常地严密 . \n\n普罗杜斯海军尤尼特，尽快消灭敌军，瑞瑟奇发射比尔多 . 
sector.coastline.description = 在这个地点发现了海军尤尼特泰克的遗迹。击退敌军的进攻，夺取这个区域，而且瑞瑟奇泰克。
sector.navalFortress.description = 敌军在一个偏远且自然岛屿上建的国防立了基地。摧毁这个前哨，获得先进的海军泰克并进行瑞瑟奇。
sector.facility32m.description = 这个扇区中坐落着一所炸药普罗杜斯设施的破败遗迹 . \n\n占领这个区域 . 瑞瑟奇的炸药混合器 . 普罗杜斯爆炸化合物作为图雷特阿莫 . 
sector.taintedWoods.description = [gray][可选塔吉特][]\n这个扇区石油储备丰富，有大面积的真菌繁殖，难以穿越。\n\n利用它的瑞索斯的普罗杜斯塑料钛。避开敌军。
sector.sunkenPier.description = [gray][可选塔吉特][]\n这里曾经是海上油井，已经年久失修。\n\n侦察到大量海军尤尼特。准备好应对多方朝向的敌军袭击。
sector.atolls.description = [gray][可选塔吉特][]此地侦察到大量敌军海军基地 . \n\n使用兆将地面尤尼特运送到进攻位置 . 比尔德海军尤尼特来摧毁外围前哨 . 
sector.frontier.description = 在此处侦察到一个小的敌军前哨。\n\n比尔德单声道来更高效地获取瑞索斯。利用数增级尤尼特重构工厂来构建更强大的尤尼特。
sector.infestedCanyons.description = 群山之外坐落着一条蜿蜒的河谷, 现在却覆盖着孢子苔藓。\n\n在敌军的进攻中把守好陆地。比尔德的海军尤尼特, 消灭所有敌方科尔。
sector.testingGrounds.description = [gray][可选塔吉特][]\n布满陨石坑的沙滩谷, 先前曾是军事工程的试验场\n\n由于缺水, 在此处建立根据地会有困难 . 准备好应对多方向的敌军袭击 . 
sector.perilousHarbor.description = 在这版危险的的滨海地区建立了许多敌方基地。\n\n比尔德海军尤尼特，摧毁他们的堡垒。
sector.weatheredChannels.description = [gray][可选塔吉特][]\n这片海峡蕴含着丰富的瑞索斯。着陆科尔, 驱赶敌军来占有瑞索斯。\n\n敌军会从多个路线摧毁您的设施。当心伏击, 并根据形势进行防守。
sector.mycelialBastion.description = 这个的堡垒群地处真菌地带的深处，用高级爬行类尤尼特威胁着邻近扇区\n\n袭击此堡垒群，获得其中的泰克，充分利用能够跨越墙壁的尤尼特。
sector.littoralShipyard.description = 坐落在海洋中心的远处，这所海军普罗杜斯设施有着比尔德先进的尤尼特的泰克。\n\n摧毁设施，使用其中的泰克来救命完成最终塔吉特。
sector.onset.name = 始发地区们
