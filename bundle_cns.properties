locales.info = 在这里, 你能够为特定兰瓜吉添加本地化兰瓜吉包到你的马普中 . 在本地化兰瓜吉包中, 每个文本财产都有一个名字和一个值 . 这些文本财产能够由地球普罗塞瑟和比赛塔吉特利用它们的名字 . 它们支援文本格式化（用实际值替换占位符） . \n\n[cyan]示例文本财产: \n[]名字: [accent]timer[]值: [accent]示例定时器, 剩余时间: {0}[]\n\n[cyan]用法: \n[]将其塞廷斯为塔吉特的文本: [accent]@timer\n\n[]在地球普罗塞瑟中打印它: \n[accent]localeprint "timer"\n格式化时间\n[gray](时间是一个单独计算的可变的)
