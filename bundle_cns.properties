block.illuminator.description = 供给照明。
block.message.description = 拯救文字情报，用于队友间进行交流。
block.reinforced-message.description = 拯救文字情报，用于队友间进行交流 . 
block.world-message.description = 一个用于制图的消息板。不能够被摧毁。
block.world-processor.description = 注意：一个用于制图的处理机 . 不可以够被摧毁 . 可使用特殊命令，如产生单元或改变地块 . 
block.world-cell.description = 一个用于制图的记忆元。不是有能力去被摧毁。
block.world-switch.description = 一只用于制图的交换机。不可以够被摧毁。只能与同队播放器交互。
block.shield-projector.description = 一个用于制图的盾牌投影仪。不能够被摧毁。
block.large-shield-projector.description = 一个被使用于制图的盾牌投影仪。不能够被摧毁。
