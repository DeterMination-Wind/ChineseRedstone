block.mechanical-drill.description = 放置在矿物上时, 以慢的速率没有限制输出项目。只能开采基本资源。
block.pneumatic-drill.description = 一种改进的演习, 能开采泰坦。采矿速率比机械演习快。
block.laser-drill.description = 通过激光技术们更快地开采，但需求功率。这种演习是有能力去开采放射性的雷神。
block.blast-drill.description = 终极演习，需求大量功率。
block.water-extractor.description = 从地下提取水，适被使用于附近没有地表水的情况。
block.cultivator.description = 将大气中低浓度的孢子培养成孢子豆荚。
