block.core-shard.description = 基地的科尔。一旦它被摧毁,这个扇区就丢失了。
block.core-shard.details = 第一次迭代。紧凑。自我复制。装备有单次使用的发射推进器。不是为行星际旅行设计的。
block.core-foundation.description = 基地的科尔。装甲优良。容量比初代科尔更大。
block.core-foundation.details = 次代科尔。
block.core-nucleus.description = 基地的科尔。装甲极佳, 容量极大。
block.core-nucleus.details = 三代也是终代科尔。
block.vault.description = 大量存储各种打字的艾特姆。可利用卸货者卸载艾特姆。
block.container.description = 少量存储各种打字的艾特姆。可利用卸货者卸载艾特姆。
block.unloader.description = 从周围的比尔多卸载指定艾特姆 . 
